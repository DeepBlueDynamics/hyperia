name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false # one platform (e.g. flaky Windows signing) failing shouldn't drop the others
      matrix:
        include:
          # Pinned to windows-2022 (VS 2022). windows-latest moved to an image
          # with VS 18, which the bundled node-gyp can't detect → native rebuild
          # (native-process-working-directory) fails in install-app-deps.
          - os: windows-2022
            rust_target: x86_64-pc-windows-msvc
          - os: macos-latest
            rust_target: x86_64-apple-darwin
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    # Hard cap per leg — without it a hung step (default job timeout is 6h)
    # silently blocks the release job that attaches ALL platform assets.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # rcedit@5.0.2 (transitive via electron-builder) requires >= 22.12.
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # macOS: also build arm64 sidecar
      - name: Setup Rust ARM64 target (macOS)
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Linux: the sidecar's TTS stack (rodio → cpal) compiles against ALSA —
      # without libasound2-dev the cargo build fails at alsa-sys.
      # Hardened after a 2h hang here wedged the v0.17.0 release: the runner's
      # unattended-upgrades can hold the dpkg lock and a flaky mirror can stall
      # apt-get update indefinitely (no default step timeout). Lock-timeout +
      # noninteractive + one retry + a hard 10-minute cap: a flake now fails
      # fast (and re-runs), instead of silently blocking the release job.
      - name: Install Linux sidecar build deps (ALSA for rodio/cpal)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for i in 1 2; do
            sudo apt-get -o DPkg::Lock::Timeout=180 update && \
            sudo apt-get -o DPkg::Lock::Timeout=180 install -y libasound2-dev pkg-config && break
            echo "apt attempt $i failed; retrying in 20s" && sleep 20
          done

      # Build sidecar
      # On macOS we MUST use --target so the binary lands in the
      # target/<triple>/release/ path that bin/cp-sidecar.js reads from.
      # A bare `cargo build --release` puts it at target/release/ and the
      # packaging step doesn't find it ("Sidecar binary not found …").
      - name: Build sidecar (release, default target)
        if: matrix.os != 'macos-latest'
        run: cargo build --release --manifest-path sidecar/Cargo.toml

      # Intel mac: --no-default-features drops the `tts` feature — ort provides
      # no prebuilt ONNX Runtime for x86_64-apple-darwin, so this leg ships
      # without voice (the /api/tts route reports unavailable).
      - name: Build sidecar x86_64 (macOS)
        if: matrix.os == 'macos-latest'
        run: cargo build --release --manifest-path sidecar/Cargo.toml --target x86_64-apple-darwin --no-default-features

      - name: Build sidecar ARM64 (macOS)
        if: matrix.os == 'macos-latest'
        run: cargo build --release --manifest-path sidecar/Cargo.toml --target aarch64-apple-darwin

      # Build Electron app
      - name: Build app
        run: yarn build

      # Linux needs extra deps for electron-builder
      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm snapd

      # Package installer
      - name: Build installer (Windows)
        if: matrix.os == 'windows-2022'
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Azure Trusted Signing — build/win/sign.js reads AZURE_CLIENT_SECRET
          # from env (tenant + client ID are hardcoded in sign.js). With this
          # set, CI produces a SIGNED Windows .exe — no local build + swap.
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build installer (macOS)
        if: matrix.os == 'macos-latest'
        # Signs with the Developer ID cert from CSC_LINK and notarizes via
        # Apple's notary service (electron-builder does both in this one step;
        # mac.notarize.teamId in electron-builder.json triggers notarization).
        # NOTE secret naming: the cert is CSC_LINK but the p12 password secret
        # is MAC_CSC_KEY_PASSWORD.
        run: npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build installer (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux AppImage deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: hyperia-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    # Release whatever built, even if one platform leg failed (mirrors nightly.yml's
    # publish gate). A Windows signing outage no longer blocks the macOS/Linux release.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.blockmap
            artifacts/**/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
