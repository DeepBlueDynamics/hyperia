name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read # notify-discord reads this run's per-job conclusions

jobs:
  build:
    strategy:
      fail-fast: false # one platform (e.g. flaky Windows signing) failing shouldn't drop the others
      matrix:
        include:
          # Pinned to windows-2022 (VS 2022). windows-latest moved to an image
          # with VS 18, which the bundled node-gyp can't detect → native rebuild
          # (native-process-working-directory) fails in install-app-deps.
          - os: windows-2022
            rust_target: x86_64-pc-windows-msvc
          - os: macos-14
            rust_target: x86_64-apple-darwin
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    # Hard cap per leg — without it a hung step (default job timeout is 6h)
    # silently blocks the release job that attaches ALL platform assets.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # rcedit@5.0.2 (transitive via electron-builder) requires >= 22.12.
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # macOS: also build arm64 sidecar
      - name: Setup Rust ARM64 target (macOS)
        if: matrix.os == 'macos-14'
        run: rustup target add aarch64-apple-darwin

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 300000

      # Linux: the sidecar's TTS stack (rodio → cpal) compiles against ALSA —
      # without libasound2-dev the cargo build fails at alsa-sys.
      # Hardened after a 2h hang here wedged the v0.17.0 release: the runner's
      # unattended-upgrades can hold the dpkg lock and a flaky mirror can stall
      # apt-get update indefinitely (no default step timeout). Lock-timeout +
      # noninteractive + one retry + a hard 10-minute cap: a flake now fails
      # fast (and re-runs), instead of silently blocking the release job.
      - name: Install Linux sidecar build deps (ALSA for rodio/cpal)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for i in 1 2; do
            sudo apt-get -o DPkg::Lock::Timeout=180 update && \
            sudo apt-get -o DPkg::Lock::Timeout=180 install -y libasound2-dev pkg-config && break
            echo "apt attempt $i failed; retrying in 20s" && sleep 20
          done

      # Build sidecar
      # On macOS we MUST use --target so the binary lands in the
      # target/<triple>/release/ path that bin/cp-sidecar.js reads from.
      # A bare `cargo build --release` puts it at target/release/ and the
      # packaging step doesn't find it ("Sidecar binary not found …").
      - name: Build sidecar (release, default target)
        if: matrix.os != 'macos-14'
        run: cargo build --release --manifest-path sidecar/Cargo.toml

      # Intel mac: --no-default-features drops the `tts` feature — ort provides
      # no prebuilt ONNX Runtime for x86_64-apple-darwin, so this leg ships
      # without voice (the /api/tts route reports unavailable).
      - name: Build sidecar x86_64 (macOS)
        if: matrix.os == 'macos-14'
        run: cargo build --release --manifest-path sidecar/Cargo.toml --target x86_64-apple-darwin --no-default-features

      - name: Build sidecar ARM64 (macOS)
        if: matrix.os == 'macos-14'
        run: cargo build --release --manifest-path sidecar/Cargo.toml --target aarch64-apple-darwin

      # Build Electron app
      - name: Build app
        run: yarn build

      # Linux needs extra deps for electron-builder
      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm snapd

      # Package installer
      - name: Build installer (Windows)
        if: matrix.os == 'windows-2022'
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Azure Trusted Signing — build/win/sign.js reads AZURE_CLIENT_SECRET
          # from env (tenant + client ID are hardcoded in sign.js). With this
          # set, CI produces a SIGNED Windows .exe — no local build + swap.
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build installer (macOS)
        if: matrix.os == 'macos-14'
        # Signs with the Developer ID cert from CSC_LINK and notarizes via
        # Apple's notary service (electron-builder does both in this one step;
        # mac.notarize.teamId in electron-builder.json triggers notarization).
        # NOTE secret naming: the cert is CSC_LINK but the p12 password secret
        # is MAC_CSC_KEY_PASSWORD.
        run: npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build installer (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux AppImage deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: hyperia-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    # Release whatever built, even if one platform leg failed (mirrors nightly.yml's
    # publish gate). A Windows signing outage no longer blocks the macOS/Linux release.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      # Enforce the release-name convention: "Hyperia vX.Y.Z — <theme> <emoji>".
      # The <theme> is the ANNOTATED tag's message subject — cut a release with
      #   git tag -a v0.17.69 -m "named workspaces 🗂️"
      # and the release is named "Hyperia v0.17.69 — named workspaces 🗂️".
      # A bare/lightweight tag (or an annotation that just restates the version)
      # still gets "Hyperia vX.Y.Z" — so a release can never land as just
      # "0.17.67" again (which is what this fixes).
      - name: Resolve release name from the annotated tag
        id: relname
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          subject=""
          obj="$(gh api "repos/${REPO}/git/refs/tags/${TAG}" \
            --jq '{type: .object.type, sha: .object.sha}' 2>/dev/null || echo '{}')"
          if [ "$(echo "$obj" | jq -r '.type // empty')" = "tag" ]; then
            sha="$(echo "$obj" | jq -r '.sha')"
            subject="$(gh api "repos/${REPO}/git/tags/${sha}" --jq '.message' 2>/dev/null | head -n1 || true)"
          fi
          # Drop a leading "vX.Y.Z — " if the annotation restates the version.
          subject="$(printf '%s' "$subject" | sed -E 's/^[[:space:]]*v?[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*[—:-]*[[:space:]]*//')"
          if [ -n "${subject// /}" ]; then
            title="Hyperia ${TAG} — ${subject}"
          else
            title="Hyperia ${TAG}"
          fi
          echo "title=${title}" >> "$GITHUB_OUTPUT"
          echo "Release title → ${title}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: ${{ steps.relname.outputs.title }}
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.blockmap
            artifacts/**/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Post a single release summary to Discord with each platform's build status.
  # Runs after build + release, on tag releases only. always() so it still fires
  # when a platform (or the release) failed — a partial release is exactly when
  # the ping matters.
  notify-discord:
    needs: [build, release]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Post release status to Discord
        env:
          # Discord bot API (not a webhook): posts as the bot into the channel.
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_BOT_TOKEN:-}" ] || [ -z "${DISCORD_CHANNEL_ID:-}" ]; then
            echo "DISCORD_BOT_TOKEN / DISCORD_CHANNEL_ID not set — skipping Discord post."
            exit 0
          fi

          # Every job's name + conclusion for THIS run (the three build legs +
          # the release job). --jq streams objects; jq -s collects them.
          jobs_json="$(gh api --paginate "repos/${REPO}/actions/runs/${RUN_ID}/jobs" \
            --jq '.jobs[] | {name, conclusion}' | jq -s '.')"

          emoji() {
            case "$1" in
              success)   printf '✅' ;;
              failure)   printf '❌' ;;
              cancelled) printf '⏹️' ;;
              skipped)   printf '⏭️' ;;
              *)         printf '❔' ;;
            esac
          }
          # Conclusion of the job whose name CONTAINS $1. Matrix legs are named
          # "build (windows-2022, x86_64-…)", so we substring-match on the OS.
          conc() { echo "$jobs_json" | jq -r --arg n "$1" \
            'map(select(.name | contains($n))) | (.[0].conclusion // "unknown")'; }

          win="$(conc 'windows-2022')"
          mac="$(conc 'macos-14')"
          lin="$(conc 'ubuntu-latest')"
          rel="$(conc 'release')"

          # green all-pass · red all-fail · gold mixed
          passes=0; fails=0
          for c in "$win" "$mac" "$lin"; do
            if [ "$c" = success ]; then passes=$((passes+1)); else fails=$((fails+1)); fi
          done
          if   [ "$fails" -eq 0 ]; then color=3066993
          elif [ "$passes" -eq 0 ]; then color=15158332
          else color=15844367
          fi

          subject="$(printf '%s' "${COMMIT_MSG:-}" | head -n1)"
          release_url="https://github.com/${REPO}/releases/tag/${TAG}"

          payload="$(jq -n \
            --arg title "🚀 Hyperia ${TAG}" \
            --arg url "$release_url" \
            --argjson color "$color" \
            --arg win "$(emoji "$win") Windows (x64) — ${win}" \
            --arg mac "$(emoji "$mac") macOS — ${mac}" \
            --arg lin "$(emoji "$lin") Linux (x64) — ${lin}" \
            --arg rel "$(emoji "$rel") ${rel}" \
            --arg footer "${SHA:0:7} — ${subject}" \
            '{embeds: [{
               title: $title, url: $url, color: $color,
               fields: [
                 {name: "Windows", value: $win, inline: true},
                 {name: "macOS",   value: $mac, inline: true},
                 {name: "Linux",   value: $lin, inline: true},
                 {name: "Release", value: $rel, inline: false}
               ],
               footer: {text: $footer}
             }]}')"

          curl -sf -X POST \
            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "https://discord.com/api/v10/channels/${DISCORD_CHANNEL_ID}/messages"
          echo "Posted release status to Discord channel ${DISCORD_CHANNEL_ID}."
