name: "CodeQL"

on:
  push:
    branches: [ canary ]
  pull_request:
    branches: [ canary ]
  schedule:
    - cron: '37 6 * * 5'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # Reference the config file so vendored bundles like
        # bin/yarn-standalone.js and bin/rimraf-standalone.js are excluded.
        # They're third-party rolled-up distributions we don't maintain;
        # warnings in them can't be cleanly patched without diverging from
        # upstream. Our own scripts and source dirs are still scanned.
        config-file: ./.github/codeql/codeql-config.yml

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
