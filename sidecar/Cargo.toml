[package]
name = "hyperia-sidecar"
version = "0.16.27"
edition = "2021"
description = "Rust sidecar for Hyperia: agent engine, MCP, signaling"

[workspace]
# The vendored crates under crates/ are path DEPENDENCIES, not workspace members.
# Excluding them keeps them out of the workspace so their (build-only, vestigial)
# [profile] sections don't emit "profile ignored" warnings — behaviour is
# identical to when they lived at ../ outside the workspace.
exclude = ["crates/lume", "crates/aegis-edit", "crates/grub-md"]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"

[features]
# Voice (Kokoro TTS). Default ON everywhere except x86_64-apple-darwin, where
# ort has no prebuilt ONNX Runtime — Intel-mac CI builds --no-default-features.
default = ["tts"]
tts = ["dep:kokoro-tts", "dep:rodio"]

[dependencies]
# HTTP server + WebSocket bridge
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
# Local BM25 search engine (lib-only slice) — backs per-shell log search and
# sticky-note search. Vendored crate under crates/; no network, no CLI.
lume = { path = "crates/lume" }
# Grapheme-safe line-oriented piece-table editor (LOPT + BFTP). Backs
# multi-agent / locked-block sticky editing. Vendored crate under crates/, lib-only.
aegis-edit = { path = "crates/aegis-edit" }
# HTML → clean reader-mode markdown (grub's converter, pyo3 stripped). Turns a
# web pane's rendered DOM into markdown for web_pane_content. Vendored under crates/.
grub-md = { path = "crates/grub-md" }

# ── Local text-to-speech (Kokoro-82M) — backs hyperia_spoken_summary ──────────
# ort-based Kokoro with a built-in pure-Rust G2P (cross-compile friendly — no
# espeak/clang/nasm). ONNX model auto-downloads on first synthesis. OPTIONAL:
# gated behind the default-on `tts` feature because ort ships no prebuilt ONNX
# Runtime for x86_64-apple-darwin — Intel-mac builds pass --no-default-features
# and get a sidecar without voice (the /api/tts route reports unavailable).
kokoro-tts = { version = "0.3", features = ["use-cmudict"], optional = true }
# Play the synthesized WAV on the machine (WASAPI/CoreAudio/ALSA via cpal).
rodio = { version = "0.22", optional = true }

# Claude API + HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
base64 = "0.22"
# OS CSPRNG for access-token generation (XOR-mixed with the sdrrand true-random relay).
getrandom = "0.2"

# MCP server (stdio + streamable HTTP/SSE)
rmcp = { version = "0.15", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "schemars"] }
schemars = "1.0"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async streaming (for Ghost SSE)
async-stream = "0.3"

# Screenshot rendering
png = "0.17"
font8x8 = "0.3"

# Terminal parsing (for screen dumps from Electron)
vt100 = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1"
urlencoding = "2.1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Process tree (foreground process detection)
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

# Ferricula memory: hyperia talks to ferricula over HTTP. Run ferricula
# locally in Docker (`docker compose up ferricula`) or point at a remote URL.
# No crate dependency — the sidecar builds anywhere without ferricula source.

# Windows PE VERSIONINFO resource — populates the Authenticode-independent
# "publisher" field that the Windows Defender Firewall dialog reads.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
