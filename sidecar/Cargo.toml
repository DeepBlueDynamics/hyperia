[package]
name = "hyperia-sidecar"
version = "0.7.5"
edition = "2021"
description = "Rust sidecar for Hyperia: agent engine, MCP, signaling"

[workspace]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"

[dependencies]
# HTTP server + WebSocket bridge
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Claude API + HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
base64 = "0.22"

# MCP server (stdio)
rmcp = { version = "0.15", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.0"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async streaming (for Ghost SSE)
async-stream = "0.3"

# Screenshot rendering
png = "0.17"

# Terminal parsing (for screen dumps from Electron)
vt100 = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
urlencoding = "2.1"

# CLI
clap = { version = "4", features = ["derive"] }

# Ferricula memory core (embedded)
ferricula = { path = "../../ferricula" }
