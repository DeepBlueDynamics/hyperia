<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>👻 Hyperia</title>
<style>
  :root {
    --bg:        #08080f;
    --bg-dim:    #0a0a14;
    --bg-soft:   #12121e;
    --line:      #1a1a2e;
    --line-soft: #14141d;
    --text:      #c8d0e0;
    --text-dim:  #777;
    --text-faint:#555;
    --accent:    #c839c5;
    --user:      #36c93c;
    --system:    #96c9ff;
    --tool:      #c98536;
    --error:     #e08080;
    --ok:        #5cc88c;
    --font:      'JetBrains Mono', 'Cascadia Code', 'Consolas', 'Menlo', monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    line-height: 1.55;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── titlebar (slim, cross-platform — single close × on the right) ─── */
  .titlebar {
    flex: 0 0 auto;
    height: 28px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    background: var(--bg-dim);
    border-bottom: 1px solid var(--line);
    user-select: none;
  }
  .titlebar .name {
    flex: 1;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
  }
  .titlebar .hud {
    display: flex;
    gap: 12px;
    font-size: 10px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .titlebar .hud .stat {
    display: flex;
    gap: 5px;
    align-items: baseline;
  }
  .titlebar .hud .v {
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .titlebar .hud .stat.reset:hover {
    background: var(--line) !important;
    color: var(--text-dim) !important;
  }
  .usage-badge {
    color: var(--text-faint);
    font-size: 10px;
    margin-left: 6px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    opacity: 0.8;
  }

  /* ─── status strip ─── */
  .status {
    flex: 0 0 auto;
    display: flex;
    gap: 16px;
    padding: 4px 12px;
    font-size: 10px;
    color: var(--text-faint);
    border-bottom: 1px solid var(--line-soft);
    background: #06060a;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .status .item { display: flex; gap: 5px; }
  .status .item .v { color: var(--text-dim); }
  .status .item.live .v::before {
    content: "●";
    color: var(--ok);
    margin-right: 4px;
    animation: blink-soft 2.4s ease-in-out infinite;
  }
  .status .item.dead .v::before {
    content: "●";
    color: var(--error);
    margin-right: 4px;
  }
  .status .item.clickable {
    cursor: pointer;
  }
  .status .item.clickable:hover .v {
    color: var(--accent);
    text-decoration: underline;
  }
  .status .item .warn {
    color: var(--error);
    margin-left: 6px;
    font-size: 9px;
  }
  @keyframes blink-soft {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.3; }
  }

  /* ─── scrollback screen ─── */
  .screen {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 12px 14px 18px;
    scroll-behavior: smooth;
  }
  .screen::-webkit-scrollbar { width: 8px; }
  .screen::-webkit-scrollbar-track { background: transparent; }
  .screen::-webkit-scrollbar-thumb { background: var(--line); border-radius: 0; }
  .screen::-webkit-scrollbar-thumb:hover { background: #2a2a3c; }

  .row {
    display: flex;
    gap: 10px;
    padding: 1px 0;
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
    animation: fade 0.15s ease;
  }
  @keyframes fade {
    from { opacity: 0; transform: translateY(2px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .row .label {
    flex: 0 0 auto;
    font-weight: 500;
    user-select: text;
  }
  .row .body {
    flex: 1;
    min-width: 0;
  }
  .row.user   .label { color: var(--user); }
  .row.agent  .label { color: var(--accent); }
  .row.system .label { color: var(--system); }
  .row.error  .label { color: var(--error); }
  .row.user   .body  { color: #e8edf4; }
  .row.agent  .body  { color: var(--text); }
  .row.system .body  { color: var(--text-dim); }
  .row.error  .body  { color: var(--error); }
  .row.agent.streaming .body::after {
    content: "_";
    color: var(--accent);
    margin-left: 2px;
    font-weight: 700;
    animation: cursor-blink 1s steps(1) infinite;
  }
  @keyframes cursor-blink {
    0%, 49%  { opacity: 1; }
    50%, 100%{ opacity: 0; }
  }
  .row.user.injected .label::before {
    content: "[queued] ";
    color: var(--text-faint);
    font-style: italic;
  }
  .row.watercooler {
    color: var(--text-faint);
    font-size: 11px;
    padding: 6px 0;
    border-top: 1px dashed var(--line);
    border-bottom: 1px dashed var(--line);
    margin: 6px 0;
    justify-content: center;
    font-style: italic;
  }

  /* inline marks */
  .row .body code {
    color: var(--accent);
    background: rgba(200,57,197,0.08);
    padding: 0 4px;
    font-family: inherit;
    font-size: 12px;
    border-radius: 2px;
  }
  .row .body em.path  { color: var(--system); font-style: normal; }
  .row .body em.ok    { color: var(--ok);     font-style: normal; }
  .row .body em.fail  { color: var(--error);  font-style: normal; }

  /* ─── tool rows ─── */
  /* Override the base .row { display: flex } — tool rows are block so the
     summary line stays inline and the output collapses cleanly onto its
     own line below. */
  .row.tool {
    display: block;
    color: var(--text-faint);
    font-size: 12px;
    border-left: none;
    padding: 0;
    margin-left: 0;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .row.tool:hover {
    background: var(--bg-soft);
  }
  .row.tool .summary {
    display: flex;
    gap: 8px;
    align-items: baseline;
    min-width: 0;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .row.tool .label {
    color: var(--tool);
    width: 16px;
    text-align: center;
    flex: 0 0 auto;
  }
  .row.tool .label.running {
    animation: pulse-emoji 0.85s ease-in-out infinite;
  }
  @keyframes pulse-emoji {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.55; transform: scale(1.15); filter: brightness(1.5); }
  }
  .row.tool .chev {
    color: var(--text-faint);
    font-size: 9px;
    flex: 0 0 auto;
    transition: transform 0.2s ease;
    display: inline-block;
  }
  .row.tool.expanded .chev {
    transform: rotate(90deg);
    color: var(--accent);
  }
  .row.tool .name {
    color: var(--text-dim);
    font-weight: 500;
    flex: 0 0 auto;
  }
  .row.tool .arg {
    color: var(--text-faint);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .row.tool .meta {
    color: var(--text-faint);
    font-size: 10px;
    margin-left: auto;
    flex: 0 0 auto;
  }
  .row.tool .meta .ok   { color: var(--ok); }
  .row.tool .meta .fail { color: var(--error); }
  .row.tool .output {
    display: none;          /* hard collapse — no measured height when closed */
    color: var(--text-faint);
    font-family: var(--font);
    font-size: 11px;
    border-left: none;
    padding-left: 0;
    margin-top: 4px;
    margin-left: 14px;
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
    max-height: 140px;
    overflow-y: auto;
    padding-bottom: 4px;
  }
  .row.tool.expanded .output {
    display: block;
  }
  .row.tool.thinking-row {
    border-left: none !important;
    padding-left: 0 !important;
    margin-left: 0 !important;
    opacity: 0.8;
  }
  .row.tool.thinking-row .summary {
    font-size: 11px;
  }
  .row.tool.thinking-row .output {
    border-left: none !important;
    padding-left: 0 !important;
    margin-left: 14px !important;
    font-size: 11px;
    font-style: italic;
    color: var(--text-dim);
  }

  /* ─── pasted assets (image / pdf / text files) ─── */
  .row.asset {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 6px 0 6px 8px;
    border-left: 2px solid var(--tool);
    margin-left: -2px;
  }
  .row.asset .label {
    color: var(--tool);
    flex: 0 0 auto;
    width: 18px;
    text-align: center;
  }
  .row.asset .info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .row.asset .info .name {
    color: var(--text);
    font-size: 12px;
    word-break: break-all;
  }
  .row.asset .info .meta {
    color: var(--text-faint);
    font-size: 10px;
  }
  .row.asset .info .meta a {
    color: var(--accent);
    text-decoration: none;
  }
  .row.asset .info .meta a:hover { text-decoration: underline; }
  .row.asset .thumb {
    max-height: 96px;
    max-width: 200px;
    border: 1px solid var(--line);
    border-radius: 2px;
    margin-top: 2px;
    display: block;
    background: var(--bg-soft);
    object-fit: contain;
  }
  .row.asset .remove {
    color: var(--text-faint);
    cursor: pointer;
    flex: 0 0 auto;
    padding: 0 4px;
    align-self: flex-start;
  }
  .row.asset .remove:hover { color: var(--error); }

  /* drop overlay — full-pane prompt when the user drags a file in */
  .drop-overlay {
    position: fixed;
    inset: 0;
    background: rgba(200, 57, 197, 0.08);
    border: 2px dashed var(--accent);
    pointer-events: none;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  body.dragging .drop-overlay { display: flex; }

  /* ─── inline show_widget (input/picker/button/form) — terminal style ─── */
  .row.widget {
    display: block;
    border-left: 2px solid var(--accent);
    padding: 4px 0 4px 8px;
    margin-left: -2px;
    margin-top: 4px;
    margin-bottom: 4px;
    background: rgba(200,57,197,0.04);
    white-space: normal;
  }
  .row.widget .prompt {
    color: var(--accent);
    margin-bottom: 4px;
  }
  .row.widget .field {
    display: flex;
    gap: 6px;
    align-items: baseline;
    padding: 1px 0;
  }
  .row.widget .field-label {
    color: var(--text-dim);
    flex: 0 0 auto;
    min-width: 80px;
  }
  .row.widget input {
    flex: 1;
    background: var(--bg-soft);
    color: var(--text);
    border: 1px solid var(--line);
    font: inherit;
    font-size: 12px;
    padding: 2px 6px;
    outline: 0;
  }
  .row.widget input:focus { border-color: var(--accent); }
  .row.widget .option {
    color: var(--text-dim);
    cursor: pointer;
    padding: 1px 0;
  }
  .row.widget .option .key {
    color: var(--accent);
    margin-right: 6px;
  }
  .row.widget .option:hover { color: var(--text); }
  .row.widget .option:hover .key { color: var(--user); }
  .row.widget .actions {
    margin-top: 4px;
    display: flex;
    gap: 8px;
  }
  .row.widget button {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    font: inherit;
    font-size: 11px;
    padding: 2px 10px;
    cursor: pointer;
  }
  .row.widget button:hover { background: rgba(200,57,197,0.1); }
  .row.widget button.dismiss { color: var(--text-faint); border-color: var(--line); }
  .row.widget.submitted {
    opacity: 0.6;
    border-left-color: var(--ok);
  }
  .row.widget.submitted .response {
    color: var(--ok);
    margin-top: 2px;
    font-size: 11px;
  }

  /* ─── mounted widget (iframe-hosted dynamic UI from tool_mount) ─── */
  .row.widget-host {
    display: block;
    border-left: 2px solid var(--tool);
    padding: 4px 0 4px 8px;
    margin: 6px 0;
    background: rgba(201,133,54,0.04);
  }
  .row.widget-host .label-line {
    display: flex;
    gap: 8px;
    color: var(--text-faint);
    font-size: 11px;
    margin-bottom: 4px;
    align-items: baseline;
  }
  .row.widget-host .label-line .name { color: var(--tool); }
  .row.widget-host .label-line .id   { color: var(--text-faint); opacity: 0.6; font-size: 10px; }
  .row.widget-host .label-line .dismiss {
    margin-left: auto;
    cursor: pointer;
    color: var(--text-faint);
    padding: 0 4px;
  }
  .row.widget-host .label-line .dismiss:hover { color: var(--error); }
  .row.widget-host iframe {
    width: 100%;
    border: 0;
    background: transparent;
    display: block;
  }

  /* ─── input prompt (pinned bottom) ─── */
  .promptline {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    align-items: flex-start;
    padding: 8px 14px 10px;
    border-top: 1px solid var(--line);
    background: var(--bg-dim);
    position: relative;
  }
  .promptline::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: -1px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.3;
  }
  .promptline .label {
    color: var(--user);
    flex: 0 0 auto;
    font-weight: 500;
    padding-top: 2px;
  }
  .promptline textarea {
    flex: 1;
    background: transparent;
    color: var(--text);
    border: 0;
    outline: 0;
    resize: none;
    font: inherit;
    font-size: 13px;
    line-height: 1.55;
    max-height: 140px;
    caret-color: var(--accent);
    padding: 1px 0;
  }
  .promptline textarea::placeholder { color: var(--text-faint); }
  .promptline .hint {
    color: var(--text-faint);
    font-size: 10px;
    padding-top: 4px;
    white-space: nowrap;
    letter-spacing: 0.5px;
    flex: 0 0 auto;
  }
  .promptline .hint kbd {
    background: var(--bg-soft);
    color: var(--text-dim);
    border: 1px solid var(--line);
    padding: 1px 5px;
    font-family: var(--font);
    font-size: 10px;
  }
  .promptline.busy .label { color: var(--text-faint); }
  .promptline.busy .hint b { color: var(--accent); }
</style>
</head>
<body>

<div class="titlebar">
  <div class="name">hyperia · shell</div>
  <div class="hud">
    <div class="stat"><span>in</span><span class="v" id="hud-in">0</span></div>
    <div class="stat"><span>out</span><span class="v" id="hud-out">0</span></div>
    <div class="stat"><span>tools</span><span class="v" id="hud-tools">0</span></div>
    <div class="stat"><span>turns</span><span class="v" id="hud-turns">0</span></div>
    <div class="stat reset" id="hud-reset" title="reset metrics" style="cursor: pointer; padding: 0 4px; border: 1px solid var(--line); border-radius: 3px; background: var(--bg-soft); font-size: 8px; font-weight: bold; margin-left: 4px; align-self: center; display: inline-flex; align-items: center; justify-content: center; height: 14px; text-transform: uppercase;">reset</div>
  </div>
</div>

<div class="status" id="status">
  <div class="item"><span>sidecar</span><span class="v" id="s-sidecar">…</span></div>
  <div class="item"><span>level</span><span class="v" id="s-level">…</span></div>
  <div class="item clickable" id="s-model-item" title="click to switch model"><span>model</span><span class="v" id="s-model">…</span></div>
  <div class="item"><span>ferricula</span><span class="v" id="s-ferricula">…</span></div>
</div>

<div class="screen" id="screen"></div>

<div class="promptline" id="promptline">
  <span class="label" id="prompt-label">you~&gt;</span>
  <textarea id="input" rows="1" autofocus spellcheck="false"
    placeholder="ask anything"></textarea>
  <span class="hint" id="hint">
    <kbd>↵</kbd> send · <kbd>⇧↵</kbd> newline · <kbd>esc</kbd> stop · <kbd>⌘V</kbd> paste asset
  </span>
</div>

<div class="drop-overlay">drop to attach</div>

<script>
'use strict';

// ───────────────────────────────────────────────────────────────────────
// DOM refs + small helpers
// ───────────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const screen     = $('screen');
const input      = $('input');
const promptline = $('promptline');
const hint       = $('hint');
const promptLbl  = $('prompt-label');

const STATS = { in: 0, out: 0, tools: 0, turns: 0 };
let turn_in = 0;
let turn_out = 0;
function updateHud() {
  $('hud-in').textContent    = STATS.in.toLocaleString();
  $('hud-out').textContent   = STATS.out.toLocaleString();
  $('hud-tools').textContent = STATS.tools;
  $('hud-turns').textContent = STATS.turns;
}

const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

function autoscroll() { screen.scrollTop = screen.scrollHeight; }

// ───────────────────────────────────────────────────────────────────────
// Tool emoji registry — purely cosmetic; falls back to 🔧 if unknown
// ───────────────────────────────────────────────────────────────────────
const TOOL_EMOJI = {
  terminal_run: '🖥️', terminal_keys: '⌨️', terminal_screen: '📺',
  terminal_status: '📋', terminal_split: '⬛', terminal_focus: '🎯',
  terminal_new_tab: '➕', terminal_new_window: '🪟', terminal_close: '✖️',
  tab_snapshot: '📸', shell_state: '🐚', open_web_pane: '🌐',
  web_pane_content: '🌐', web_pane_eval: '🌐', web_pane_mouse: '🖱️',
  file_read: '📖', file_write: '✏️', file_edit: '🩹', list_files: '📁',
  grep: '🔍', web_fetch: '🌐', web_search: '🔭',
  doctor: '🩺', model_catalog: '📚', docker_run: '🐳', help: '❓',
  memory_recall: '🧠', memory_remember: '💾', memory_dream: '💤',
  memory_status: '📊', memory_connect: '🔗', memory_sql: '🗃️',
  memory_inspect: '🔎', memory_keystone: '⭐', memory_neighbors: '🕸️',
  memory_embody: '🪞',
  watercooler: '☕', maximus_explain: '🔬',
  show_input: '⌨️', show_picker: '☰', show_button: '⬢', show_form: '📝',
  tool_search: '🔎', tool_create: '🔧',
  settings_get: '⚙️', settings_set: '⚙️', settings_list_profiles: '⚙️',
  sticky_note_create: '🗒️', sticky_note_update: '🗒️', sticky_note_delete: '🗒️',
};
const getEmoji = (n) => TOOL_EMOJI[n] || '🔧';

// One-line label for a finished tool — "<verb> · <key arg>"
function buildLabel(name, input) {
  if (!input) return name;
  switch (name) {
    case 'terminal_run':    return `run · ${input.command || ''}`;
    case 'terminal_keys':   return `keys · ${(input.keys || '').slice(0, 40)}`;
    case 'terminal_screen': return `screen${input.pane ? ' · pane ' + input.pane : ''}`;
    case 'terminal_split':  return `split · ${input.direction || ''}`;
    case 'terminal_focus':  return `focus${input.tab ? ' · ' + input.tab : ''}`;
    case 'terminal_new_tab':return `new tab${input.profile ? ' · ' + input.profile : ''}`;
    case 'file_read':       return `read · ${input.path || ''}`;
    case 'file_write':      return `write · ${input.path || ''}`;
    case 'file_edit':       return `edit · ${input.path || ''}`;
    case 'grep':            return `grep · "${input.pattern || ''}"`;
    case 'web_fetch':       return `fetch · ${input.url || ''}`;
    case 'web_search':      return `search · "${input.query || ''}"`;
    case 'open_web_pane':   return `pane · ${input.url || ''}`;
    case 'web_pane_content':return `read pane${input.pane ? ' · pane ' + input.pane : ''}`;
    case 'web_pane_eval':   return `eval js${input.pane ? ' · pane ' + input.pane : ''}`;
    case 'web_pane_mouse':  return `${input.action || 'click'} · (${input.x}, ${input.y})`;
    case 'tab_snapshot':    return `snapshot${input.tab ? ' · ' + input.tab : ''}`;
    case 'memory_recall':   return `recall · "${input.query || ''}"`;
    case 'memory_remember': return `remember · ${(input.text || '').slice(0, 60)}`;
    case 'memory_sql':      return `sql · ${(input.sql || '').slice(0, 60)}`;
    case 'settings_get':    return `get · ${input.path || ''}`;
    case 'settings_set':    return `set · ${input.path || ''}`;
    default:                return name;
  }
}

// ───────────────────────────────────────────────────────────────────────
// Row builders
// ───────────────────────────────────────────────────────────────────────
function addRow(role, label, bodyHtml, opts = {}) {
  const r = document.createElement('div');
  let cls = `row ${role}`;
  if (opts.streaming) cls += ' streaming';
  if (opts.injected)  cls += ' injected';
  r.className = cls;
  r.innerHTML = `<span class="label">${label}</span><div class="body"></div>`;
  if (bodyHtml != null) r.querySelector('.body').innerHTML = bodyHtml;
  screen.appendChild(r);
  autoscroll();
  return r;
}

function addWatercooler(text) {
  const r = document.createElement('div');
  r.className = 'row watercooler';
  r.innerHTML = `<div class="body">— ${escapeHtml(text)} —</div>`;
  screen.appendChild(r);
  autoscroll();
}

let activeThinkingRow = null;

function addThinkingRow(id) {
  endAgentStream();
  const r = document.createElement('div');
  r.className = 'row tool thinking-row expanded';
  r.id = 'thinking-' + id;
  r.innerHTML = `<div class="summary"><span class="chev">▸</span><span class="label">💭</span><span class="name">thinking</span><span class="arg"></span><span class="meta"></span></div><div class="output" style="display: block;"></div>`;
  r.querySelector('.summary').addEventListener('click', () => {
    r.classList.toggle('expanded');
    const out = r.querySelector('.output');
    out.style.display = r.classList.contains('expanded') ? 'block' : 'none';
  });
  screen.appendChild(r);
  activeThinkingRow = r;
  autoscroll();
}

function streamThinkingText(id, text) {
  const r = document.getElementById('thinking-' + id);
  if (!r) return;
  const outEl = r.querySelector('.output');
  if (outEl) {
    outEl.innerHTML += escapeHtml(text).replace(/\n/g, '<br>');
  }
  autoscroll();
}

function finishThinkingRow(id) {
  activeThinkingRow = null;
  const r = document.getElementById('thinking-' + id);
  if (r) {
    r.classList.remove('expanded');
    const out = r.querySelector('.output');
    if (out) out.style.display = 'none';
  }
}

function addToolRow(name, id) {
  const r = document.createElement('div');
  r.className = 'row tool';
  r.id = 'tool-' + id;
  // Summary line is the only click target — the output region below
  // doesn't toggle when you click into it (so you can select text).
  r.innerHTML = `<div class="summary"><span class="chev">▸</span><span class="label running">${getEmoji(name)}</span><span class="name">${escapeHtml(name)}</span><span class="arg">running…</span><span class="meta"></span></div><div class="output"></div>`;
  r.querySelector('.summary').addEventListener('click', () => r.classList.toggle('expanded'));
  screen.appendChild(r);
  STATS.tools++; updateHud();
  autoscroll();
}

function finishToolRow(id, name, input, output) {
  const r = document.getElementById('tool-' + id);
  if (!r) {
    console.warn('[tool] finishToolRow: no row with id', 'tool-' + id, '(was tool_result delivered after tool_start? known ids:', Array.from(document.querySelectorAll('.row.tool')).map(el => el.id), ')');
    return;
  }
  const labelEl = r.querySelector('.label');
  if (labelEl) labelEl.classList.remove('running');
  const argEl = r.querySelector('.arg');
  if (argEl) argEl.textContent = buildLabel(name, input);
  const meta = r.querySelector('.meta');
  const isErr = /error|failed|blocked|unknown tool/i.test(output || '');
  if (meta) meta.innerHTML = isErr
    ? '<span class="fail">✗</span>'
    : '<span class="ok">✓</span>';
  const outEl = r.querySelector('.output');
  if (outEl) {
    let formattedOutput = output || '(no output)';
    if (output) {
      const trimmed = output.trim();
      if ((trimmed.startsWith('{') && trimmed.endsWith('}')) || (trimmed.startsWith('[') && trimmed.endsWith(']'))) {
        try {
          const parsed = JSON.parse(trimmed);
          formattedOutput = JSON.stringify(parsed, null, 2);
        } catch (e) {
          // Fallback to raw output
        }
      }
    }
    outEl.textContent = formattedOutput;
  }
  console.debug('[tool] finished', id, name, 'output bytes:', (output || '').length);
}

let streamingRow = null;
let streamSeenContent = false;
function startAgentStream() {
  endAgentStream();
  streamingRow = addRow('agent', 'hyperia~&gt;', '', { streaming: true });
  streamSeenContent = false;
}
function streamText(chunk) {
  if (!streamingRow) startAgentStream();
  // Strip leading whitespace from the very start of an agent turn. Some
  // local models (gemma2:2b in particular) emit several \n\n\n chunks
  // before any real content — without this they paint as blank lines.
  if (!streamSeenContent) {
    chunk = chunk.replace(/^[\s\r\n]+/, '');
    if (!chunk) return;
    streamSeenContent = true;
  }
  const body = streamingRow.querySelector('.body');
  body.innerHTML += escapeHtml(chunk).replace(/\n/g, '<br>');
  const est = Math.max(1, (chunk.length / 4) | 0);
  STATS.out += est;
  turn_out += est;
  updateHud();
  autoscroll();
}
function endAgentStream() {
  if (streamingRow) {
    streamingRow.classList.remove('streaming');
    if (turn_in > 0 || turn_out > 0) {
      const usageEl = document.createElement('span');
      usageEl.className = 'usage-badge';
      usageEl.textContent = ` [${turn_in.toLocaleString()} in · ${turn_out.toLocaleString()} out]`;
      streamingRow.querySelector('.body').appendChild(usageEl);
    }
    streamingRow = null;
  }
  streamSeenContent = false;
}

// ───────────────────────────────────────────────────────────────────────
// show_widget (input/picker/button/form) — terminal-styled, NOT bubbles
// ───────────────────────────────────────────────────────────────────────
function addShowWidget(kind, inputObj) {
  endAgentStream();
  const id = inputObj.id;
  if (!id) return;
  const r = document.createElement('div');
  r.className = 'row widget';
  r.id = 'show-' + id;

  let body = '';
  if (kind === 'input') {
    const prompt = escapeHtml(inputObj.prompt || 'enter a value');
    const inputKind = inputObj.kind === 'password' ? 'password' :
                      inputObj.kind === 'number'   ? 'number'   : 'text';
    const def = escapeHtml(String(inputObj.default ?? ''));
    body = `
      <div class="prompt">? ${prompt}</div>
      <div class="field">
        <input type="${inputKind}" value="${def}" class="show-input-value" autofocus />
      </div>
      <div class="actions">
        <button class="submit">submit</button>
        <button class="dismiss">dismiss</button>
      </div>
    `;
  } else if (kind === 'button') {
    const label = escapeHtml(inputObj.label || 'ok');
    const hintTxt = inputObj.hint ? `<div class="prompt" style="color:var(--text-faint);font-size:11px">${escapeHtml(inputObj.hint)}</div>` : '';
    body = `
      ${hintTxt}
      <div class="actions">
        <button class="submit">${label}</button>
        <button class="dismiss">dismiss</button>
      </div>
    `;
  } else if (kind === 'picker') {
    const prompt = escapeHtml(inputObj.prompt || 'pick one');
    const opts = (inputObj.options || []).map((o, i) => {
      const label = escapeHtml(String(o.label || o.value || ''));
      const desc  = o.description ? ` <span style="color:var(--text-faint)">— ${escapeHtml(o.description)}</span>` : '';
      return `<div class="option" data-value="${escapeHtml(o.value)}">
                <span class="key">[${i + 1}]</span>${label}${desc}
              </div>`;
    }).join('');
    body = `
      <div class="prompt">? ${prompt}</div>
      ${opts}
      <div class="actions">
        <button class="dismiss">dismiss</button>
      </div>
    `;
  } else if (kind === 'form') {
    const prompt = escapeHtml(inputObj.prompt || 'fill in');
    const fields = (inputObj.fields || []).map(f => {
      const fid = escapeHtml(f.id);
      const flbl = escapeHtml(f.label || f.id);
      const fkind = f.kind === 'password' ? 'password' : f.kind === 'number' ? 'number' : 'text';
      const def = escapeHtml(String(f.default ?? ''));
      const ph = f.placeholder ? ` placeholder="${escapeHtml(f.placeholder)}"` : '';
      return `<div class="field">
                <span class="field-label">${flbl}</span>
                <input data-field="${fid}" type="${fkind}" value="${def}"${ph} />
              </div>`;
    }).join('');
    const submitLbl = escapeHtml(inputObj.submit_label || 'submit');
    body = `
      <div class="prompt">? ${prompt}</div>
      ${fields}
      <div class="actions">
        <button class="submit">${submitLbl}</button>
        <button class="dismiss">dismiss</button>
      </div>
    `;
  } else {
    body = `<div class="prompt">unknown widget kind: ${escapeHtml(kind)}</div>`;
  }
  r.innerHTML = body;
  screen.appendChild(r);
  autoscroll();

  const collect = () => {
    if (kind === 'input') {
      return r.querySelector('input').value;
    } else if (kind === 'button') {
      return 'clicked';
    } else if (kind === 'form') {
      const out = {};
      r.querySelectorAll('input[data-field]').forEach(el => {
        out[el.dataset.field] = el.type === 'number' ? Number(el.value) : el.value;
      });
      return out;
    }
    return null;
  };

  const submitWith = (value, label) => submitShowWidget(r, id, value, label);
  const dismiss    = ()              => dismissShowWidget(r, id);

  if (kind === 'picker') {
    r.querySelectorAll('.option').forEach(el => {
      el.addEventListener('click', () => submitWith(el.dataset.value, el.textContent.trim()));
    });
  }
  const submitBtn = r.querySelector('button.submit');
  if (submitBtn) submitBtn.addEventListener('click', () => submitWith(collect(), null));
  r.querySelectorAll('input').forEach(el => {
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitWith(collect(), null);
      }
    });
  });
  r.querySelector('button.dismiss').addEventListener('click', dismiss);
  const firstInput = r.querySelector('input');
  if (firstInput) setTimeout(() => firstInput.focus(), 0);
}

function submitShowWidget(rowEl, id, value, displayLabel) {
  rowEl.classList.add('submitted');
  const resp = document.createElement('div');
  resp.className = 'response';
  const shown = displayLabel || (typeof value === 'object' ? JSON.stringify(value) : String(value));
  resp.textContent = '✓ ' + (shown && shown.length > 80 ? shown.slice(0, 77) + '...' : shown);
  rowEl.appendChild(resp);
  rowEl.querySelectorAll('button, input, .option').forEach(el => el.disabled = true);
  fetch('/api/ghost/ui-response', {
    method: 'POST',
    headers: {'content-type': 'application/json'},
    body: JSON.stringify({ id, value }),
  }).catch(() => {});
}
function dismissShowWidget(rowEl, id) {
  rowEl.classList.add('submitted');
  const resp = document.createElement('div');
  resp.className = 'response';
  resp.style.color = 'var(--text-faint)';
  resp.textContent = '× dismissed';
  rowEl.appendChild(resp);
  rowEl.querySelectorAll('button, input, .option').forEach(el => el.disabled = true);
  fetch('/api/ghost/ui-response', {
    method: 'POST',
    headers: {'content-type': 'application/json'},
    body: JSON.stringify({ id, dismissed: true }),
  }).catch(() => {});
}

// ───────────────────────────────────────────────────────────────────────
// tool_mount — iframe-hosted dynamic widget. Init script injects
// window.__mount_id__ + window.__data__(key) + window.__action__(name, args)
// into the widget's realm; both helpers proxy through postMessage to the
// parent (avoids CORS for the srcdoc-iframe's opaque origin).
// ───────────────────────────────────────────────────────────────────────
const WIDGET_INIT_SCRIPT = `<script>
(function(){
  function rpc(payload){
    return new Promise(function(resolve, reject){
      var rid = 'r' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      function onMsg(e){
        if (!e.data || e.data.__widget_rid !== rid) return;
        window.removeEventListener('message', onMsg);
        if (e.data.error) reject(new Error(e.data.error));
        else resolve(e.data.value);
      }
      window.addEventListener('message', onMsg);
      payload.__widget = true;
      payload.__rid = rid;
      parent.postMessage(payload, '*');
    });
  }
  window.__mount_id__ = __MOUNT_ID__;
  window.__data__   = function(key){ return rpc({ kind: 'data',   key: key }); };
  window.__action__ = function(action, args){ return rpc({ kind: 'action', action: action, args: args == null ? null : args }); };
})();
<\/script>`;

function addMountedWidget(mountId, name, srcdoc, height) {
  endAgentStream();
  const r = document.createElement('div');
  r.className = 'row widget-host';
  r.dataset.mountId = mountId;
  r.innerHTML = `
    <div class="label-line">
      <span class="name">${escapeHtml(name)}</span>
      <span class="id">${escapeHtml(mountId)}</span>
      <span class="dismiss" title="dismiss widget">✕</span>
    </div>
  `;
  const iframe = document.createElement('iframe');
  iframe.dataset.mountId = mountId;
  iframe.title = name + ' [' + mountId + ']';
  iframe.style.height = (Number(height) || 320) + 'px';
  // Note: no sandbox attribute by design (per plan — trust model is the
  // same as the agent's other tools). Adding sandbox="allow-scripts"
  // later is a one-line change that doesn't break the postMessage wire.
  const init = WIDGET_INIT_SCRIPT.replace('__MOUNT_ID__', JSON.stringify(String(mountId)));
  iframe.srcdoc = init + (srcdoc || '');
  r.appendChild(iframe);
  r.querySelector('.dismiss').addEventListener('click', () => {
    r.remove();
    // No server-side dismiss endpoint yet — widget state will linger in
    // the store until the agent's mount expires. Sidecar logs the orphan.
  });
  screen.appendChild(r);
  autoscroll();
}

// Parent-side proxy for widget postMessage RPC.
window.addEventListener('message', async (e) => {
  const d = e.data;
  if (!d || !d.__widget) return;
  let mountId = null;
  try { mountId = e.source.frameElement && e.source.frameElement.dataset.mountId; } catch (_) {}
  if (!mountId) {
    return;
  }
  try {
    if (d.kind === 'data') {
      const r = await fetch(`/api/ghost/widget/${encodeURIComponent(mountId)}/data?key=${encodeURIComponent(d.key)}`);
      if (!r.ok) {
        const j = await r.json().catch(() => ({}));
        e.source.postMessage({ __widget_rid: d.__rid, error: j.error || ('HTTP ' + r.status) }, '*');
        return;
      }
      const j = await r.json();
      e.source.postMessage({ __widget_rid: d.__rid, value: j.value }, '*');
    } else if (d.kind === 'action') {
      const r = await fetch(`/api/ghost/widget/${encodeURIComponent(mountId)}/action`, {
        method: 'POST',
        headers: {'content-type': 'application/json'},
        body: JSON.stringify({ action: d.action, args: d.args }),
      });
      if (!r.ok) {
        const j = await r.json().catch(() => ({}));
        e.source.postMessage({ __widget_rid: d.__rid, error: j.error || ('HTTP ' + r.status) }, '*');
        return;
      }
      e.source.postMessage({ __widget_rid: d.__rid, value: { ok: true } }, '*');
    }
  } catch (err) {
    e.source.postMessage({ __widget_rid: d.__rid, error: String(err && err.message || err) }, '*');
  }
});

// ───────────────────────────────────────────────────────────────────────
// Assets — paste / drop / upload. Files land in the sidecar's
// ~/.hyperia/assets/<id>.<ext> store and render inline in the
// scrollback (thumbnail for images, filename + size for everything
// else). Pending uploads are kept in `pendingAssets` so a follow-up
// phase can attach them to the next chat message.
// ───────────────────────────────────────────────────────────────────────
const pendingAssets = [];

function humanSize(b) {
  if (b == null) return '';
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1024 / 1024).toFixed(1) + ' MB';
}

function assetIcon(ct) {
  const t = (ct || '').toLowerCase();
  if (t.startsWith('image/')) return '🖼';
  if (t.startsWith('application/pdf')) return '📄';
  if (t.startsWith('text/')) return '📃';
  if (t.startsWith('application/json')) return '📋';
  return '📎';
}

function renderAssetRow(asset) {
  const r = document.createElement('div');
  r.className = 'row asset';
  r.dataset.assetId = asset.id;
  const isImage = (asset.content_type || '').toLowerCase().startsWith('image/');
  const thumb = isImage
    ? `<img class="thumb" src="${escapeHtml(asset.url)}" alt="${escapeHtml(asset.filename)}" />`
    : '';
  r.innerHTML = `
    <span class="label">${assetIcon(asset.content_type)}</span>
    <div class="info">
      <div class="name">${escapeHtml(asset.filename || asset.id)}</div>
      <div class="meta">
        ${escapeHtml(asset.content_type || 'unknown')} · ${humanSize(asset.size)} ·
        <a href="${escapeHtml(asset.url)}" target="_blank">open</a>
      </div>
      ${thumb}
    </div>
    <span class="remove" title="remove from pending">✕</span>
  `;
  r.querySelector('.remove').addEventListener('click', () => {
    const i = pendingAssets.findIndex(a => a.id === asset.id);
    if (i >= 0) pendingAssets.splice(i, 1);
    r.remove();
  });
  screen.appendChild(r);
  autoscroll();
}

async function uploadAsset(file, sourceHint) {
  if (!file) return;
  const ct = file.type || 'application/octet-stream';
  // Clipboard pastes don't carry filenames — synthesize a short one.
  const name = file.name || (sourceHint || 'pasted') + (extFromContentType(ct) || '');
  try {
    const r = await fetch('/api/ghost/asset', {
      method: 'POST',
      headers: {
        'content-type': ct,
        'x-filename': name,
      },
      body: file,
    });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      addRow('error', 'err!', 'asset upload failed: ' + escapeHtml(j.error || ('HTTP ' + r.status)));
      return;
    }
    const meta = await r.json();
    pendingAssets.push(meta);
    renderAssetRow(meta);
  } catch (e) {
    addRow('error', 'err!', 'asset upload error: ' + escapeHtml(e.message));
  }
}

function extFromContentType(ct) {
  const map = {
    'image/png': '.png', 'image/jpeg': '.jpg', 'image/gif': '.gif',
    'image/webp': '.webp', 'image/svg+xml': '.svg', 'image/bmp': '.bmp',
    'application/pdf': '.pdf', 'text/plain': '.txt',
    'text/markdown': '.md', 'text/csv': '.csv',
    'application/json': '.json', 'text/html': '.html',
  };
  return map[(ct || '').split(';')[0].trim().toLowerCase()] || '';
}

// Paste handler — fires anywhere on the page. Files in the clipboard
// (screenshots, images) get uploaded; plain-text pastes fall through
// to the textarea natively.
document.addEventListener('paste', async (e) => {
  if (!e.clipboardData) return;
  const items = Array.from(e.clipboardData.items || []);
  const files = items.filter(it => it.kind === 'file').map(it => it.getAsFile()).filter(Boolean);
  if (files.length === 0) return;          // text-only paste — let default handler take it
  e.preventDefault();
  for (const f of files) await uploadAsset(f, 'screenshot');
});

// Drag-and-drop — drop files anywhere on the body. Shows an overlay
// while dragging.
let dragDepth = 0;
window.addEventListener('dragenter', (e) => {
  if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
  dragDepth++;
  document.body.classList.add('dragging');
});
window.addEventListener('dragleave', () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) document.body.classList.remove('dragging');
});
window.addEventListener('dragover', (e) => {
  if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) {
    e.preventDefault();
  }
});
window.addEventListener('drop', async (e) => {
  dragDepth = 0;
  document.body.classList.remove('dragging');
  if (!e.dataTransfer) return;
  const files = Array.from(e.dataTransfer.files || []);
  if (!files.length) return;
  e.preventDefault();
  for (const f of files) await uploadAsset(f, 'file');
});

// Restore previously-stored assets when the shell loads. (They live on
// disk in ~/.hyperia/assets/; the in-memory map is rebuilt by the
// sidecar at startup — see asset.rs. For now this is best-effort: if
// the sidecar restarted between uploads, the meta might be empty.)
async function seedAssets() {
  try {
    const r = await fetch('/api/ghost/assets');
    if (!r.ok) return;
    const j = await r.json();
    const list = j.assets || [];
    // Don't push to pendingAssets on restore — these are historical, not
    // pending attachments for the next message.
    for (const a of list) {
      renderAssetRow(a);
    }
  } catch (_) {}
}

// ───────────────────────────────────────────────────────────────────────
// Bootstub chat — one-shot non-SSE round-trip for level=none. Lets the
// user wire a token / install ollama before any LLM gets involved.
// ───────────────────────────────────────────────────────────────────────
let currentLevel = 'none';

async function runBootstub(message) {
  setBusy(true);
  STATS.turns++; updateHud();
  let reply = null;
  try {
    const r = await fetch('/api/ghost/bootchat', {
      method: 'POST',
      headers: {'content-type': 'application/json'},
      body: JSON.stringify({ message }),
    });
    if (!r.ok) {
      addRow('error', 'err!', 'bootstub HTTP ' + r.status);
      setBusy(false);
      return;
    }
    reply = await r.json();
  } catch (e) {
    addRow('error', 'err!', 'bootstub unreachable: ' + escapeHtml(e.message));
    setBusy(false);
    return;
  }
  for (const line of (reply.system || [])) {
    addRow('system', 'system=&gt;', escapeHtml(line));
  }
  const body = escapeHtml(reply.text || '').replace(/\n/g, '<br>');
  addRow('agent', 'hyperia~&gt;', body);
  setBusy(false);

  if (reply.config_changed) {
    // Re-probe capabilities to flip levels. The next message will route
    // to /chat (real agent) instead of /bootchat.
    addRow('system', 'system=&gt;', 're-probing capabilities…');
    const caps = await bootCapabilities();
    if (caps && caps.level !== 'none') {
      addRow('agent', 'hyperia~&gt;', `bootstub stepping aside — i'm now on the <em class="ok">${escapeHtml(caps.level)}</em> path. say anything to start.`);
    }
  }
}

// ───────────────────────────────────────────────────────────────────────
// SSE chat loop
// ───────────────────────────────────────────────────────────────────────
let abortCtrl = null;

async function runChat(message) {
  setBusy(true);
  STATS.turns++;
  turn_in = 0;
  turn_out = 0;
  updateHud();
  abortCtrl = new AbortController();

  let response;
  try {
    response = await fetch('/api/ghost/chat', {
      method: 'POST',
      headers: {'content-type': 'application/json'},
      body: JSON.stringify({ message }),
      signal: abortCtrl.signal,
    });
  } catch (e) {
    addRow('error', 'err!', 'failed to reach sidecar: ' + escapeHtml(e.message));
    setBusy(false);
    return;
  }
  if (!response.ok) {
    addRow('error', 'err!', 'sidecar returned HTTP ' + response.status);
    setBusy(false);
    return;
  }

  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';

  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (!data) continue;
        try {
          const ev = JSON.parse(data);
          console.debug('[sse]', ev.type, ev);
          handleEvent(ev);
        } catch (err) {
          console.warn('[sse] JSON parse failed:', err, 'on data:', data.slice(0, 200));
        }
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') {
      addRow('error', 'err!', 'stream broken: ' + escapeHtml(e.message));
    }
  } finally {
    endAgentStream();
    setBusy(false);
    abortCtrl = null;
    await bootCapabilities();
  }
}

function handleEvent(ev) {
  switch (ev.type) {
    case 'thinking_start':
      addThinkingRow(ev.id);
      break;
    case 'thinking_delta':
      streamThinkingText(ev.id, ev.text || '');
      break;
    case 'thinking_end':
      finishThinkingRow(ev.id);
      break;
    case 'text_delta':
      streamText(ev.text || '');
      break;
    case 'tool_start':
      endAgentStream();
      addToolRow(ev.name, ev.id);
      break;
    case 'tool_result':
      finishToolRow(ev.id, ev.name, ev.input, ev.output);
      break;
    case 'show_widget':
      addShowWidget(ev.kind, ev.input || {});
      break;
    case 'tool_mount':
      addMountedWidget(ev.id, ev.name, ev.srcdoc, ev.height);
      break;
    case 'watercooler':
      addWatercooler(ev.summary || 'paused');
      break;
    case 'retrying':
      addRow('system', 'system=&gt;',
        `retrying (attempt ${ev.attempt}, waiting ${ev.wait_secs}s)`);
      break;
    case 'stats': {
      const delta_in = (ev.input_tokens || 0) - turn_in;
      const delta_out = (ev.output_tokens || 0) - turn_out;
      if (delta_in > 0) {
        STATS.in += delta_in;
        turn_in = ev.input_tokens;
      }
      if (delta_out > 0) {
        STATS.out += delta_out;
        turn_out = ev.output_tokens;
      }
      STATS.tools  = ev.tool_calls    != null ? ev.tool_calls : STATS.tools;
      STATS.turns  = ev.turns         || STATS.turns;
      updateHud();
      break;
    }
    case 'done':
      endAgentStream();
      break;
    case 'error':
      addRow('error', 'err!', escapeHtml(ev.message || 'unknown error'));
      break;
  }
}

// ───────────────────────────────────────────────────────────────────────
// Input handling (history + send + inject + stop)
// ───────────────────────────────────────────────────────────────────────
const history = [];
let histIdx = -1;

function autoresize() {
  input.style.height = 'auto';
  input.style.height = Math.min(140, input.scrollHeight) + 'px';
}
input.addEventListener('input', autoresize);

input.addEventListener('keydown', async (e) => {
  // Submit (Enter without Shift)
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    await submit();
    return;
  }
  // History nav (only single-line, no \n)
  if (e.key === 'ArrowUp' && !input.value.includes('\n') && history.length) {
    if (histIdx < history.length - 1) {
      histIdx++;
      input.value = history[history.length - 1 - histIdx];
      autoresize();
      e.preventDefault();
    }
  } else if (e.key === 'ArrowDown' && !input.value.includes('\n')) {
    if (histIdx > 0) { histIdx--; input.value = history[history.length - 1 - histIdx]; }
    else if (histIdx === 0) { histIdx = -1; input.value = ''; }
    autoresize();
    e.preventDefault();
  }
  // Esc cancels current agent turn
  if (e.key === 'Escape') {
    if (promptline.classList.contains('busy')) {
      e.preventDefault();
      fetch('/api/ghost/stop', { method: 'POST' }).catch(() => {});
      addRow('system', 'system=&gt;', 'stop requested — agent will wrap up.');
    }
  }
  // Ctrl/Cmd + L clears screen
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'l') {
    e.preventDefault();
    clearScreen();
  }
});

function redactTokenString(token) {
  if (token.length > 12) {
    return token.substring(0, 6) + '…' + token.substring(token.length - 3);
  }
  return '***';
}

function redactTokensInText(text) {
  if (!text) return '';
  const words = text.split(/(\s+)/);
  const lower = text.toLowerCase();
  const hasGeminiMention = lower.includes('gemini');

  return words.map(w => {
    const trimmed = w.replace(/^["'\s]+|["'\s]+$/g, '');
    // Anthropic
    if (trimmed.startsWith('sk-ant-') && trimmed.length > 10) {
      return w.replace(trimmed, redactTokenString(trimmed));
    }
    // OpenAI
    if (trimmed.startsWith('sk-') && !trimmed.startsWith('sk-ant-') && trimmed.length > 8) {
      return w.replace(trimmed, redactTokenString(trimmed));
    }
    // Gemini
    if (hasGeminiMention && trimmed.startsWith('AIza') && trimmed.length > 20) {
      return w.replace(trimmed, redactTokenString(trimmed));
    }
    return w;
  }).join('');
}

async function submit() {
  const line = input.value.trim();
  if (!line) return;
  history.push(line); histIdx = -1;
  input.value = '';
  autoresize();

  if (promptline.classList.contains('busy')) {
    // Inject mid-stream — soft preemption via POST /api/ghost/inject.
    addRow('user', 'you~&gt;', escapeHtml(redactTokensInText(line)), { injected: true });
    try {
      await fetch('/api/ghost/inject', {
        method: 'POST',
        headers: {'content-type': 'application/json'},
        body: JSON.stringify({ message: line }),
      });
    } catch (_) {}
    return;
  }

  addRow('user', 'you~&gt;', escapeHtml(redactTokensInText(line)));
  // Hardwired intents fire first — same set works regardless of level
  // (none/local/frontier/hybrid). If a typed phrase matches a UI we
  // already have (model picker, capabilities readout, etc.), invoke it
  // deterministically. Agent is the fallback for unstructured intent.
  if (await handleHardwiredIntent(line)) return;
  if (currentLevel === 'none') {
    await runBootstub(line);
  } else {
    await runChat(line);
  }
}

// ───────────────────────────────────────────────────────────────────────
// Hardwired typed commands — bypass the agent entirely. These exist
// because (a) small local models routinely fail to dispatch them
// correctly and (b) when a UI widget already exists for an action, the
// typed phrase should just fire it. No LLM round-trip, no hallucinated
// tool names.
// ───────────────────────────────────────────────────────────────────────
async function handleHardwiredIntent(line) {
  const m = line.trim().toLowerCase().replace(/\s+/g, ' ');
  switch (m) {
    case 'change model':
    case 'switch model':
    case 'pick model':
    case 'select model':
    case 'set model':
      openModelPicker();
      return true;

    case 'list models':
    case 'show models':
    case 'models':
    case 'what models do i have':
    case 'what models':
      await cmdListModels();
      return true;

    case 'show config':
    case 'config':
    case 'what config':
    case 'current config':
      await cmdShowConfig();
      return true;

    case 'doctor':
    case 'check':
    case 'status':
    case 'check my setup':
      await cmdDoctor();
      return true;

    case 'version':
      await cmdVersion();
      return true;

    case 'commands':
    case 'shortcuts':
    case 'cmd':
      cmdShowCommands();
      return true;

    case 'reset':
    case 'reset conversation':
    case 'new chat':
    case 'clear chat':
      await cmdResetConversation();
      return true;

    case 'wipe config':
    case 'reset config':
    case 'clear config':
    case 'wipe':
      await cmdWipeConfig();
      return true;

    case 'continue':
    case 'carry on':
    case 'resume':
      await cmdContinue();
      return true;
  }
  return false;
}

async function freshCaps() {
  try {
    const r = await fetch('/api/ghost/capabilities');
    if (!r.ok) return null;
    const j = await r.json();
    window.__caps__ = j;
    return j;
  } catch (_) {
    return null;
  }
}

async function cmdListModels() {
  const caps = await freshCaps();
  const ollama = caps && caps.providers && caps.providers.ollama;
  if (!ollama || !ollama.reachable) {
    const ollamaDisabled = ollama && ollama.disabled;
    const msg = ollamaDisabled
      ? 'ollama is disabled via configuration.'
      : 'ollama is not reachable at <code>' + escapeHtml(ollama && ollama.endpoint || 'localhost:11434') + '</code>. type <code>install ollama</code> for setup steps.';
    addRow('error', 'err!', msg);
    return;
  }
  const models = Array.isArray(ollama.models) ? ollama.models : [];
  if (!models.length) {
    addRow('system', 'system=&gt;', 'ollama is up but has no models pulled. try <code>ollama pull gemma2:2b</code>.');
    return;
  }
  addRow('system', 'system=&gt;', `installed ollama models (${models.length}):`);
  for (const name of models) {
    const current = caps.agent && caps.agent.model === name ? ' <em class="ok">← active</em>' : '';
    addRow('system', 'system=&gt;', `  • <code>${escapeHtml(name)}</code>${current}`);
  }
  addRow('system', 'system=&gt;', 'type <code>change model</code> to switch.');
}

async function cmdShowConfig() {
  const caps = await freshCaps();
  if (!caps) {
    addRow('error', 'err!', 'capabilities probe failed');
    return;
  }
  const agent = caps.agent || {};
  addRow('system', 'system=&gt;', `sidecar <code>v${escapeHtml(caps.sidecar || '?')}</code> · level <em class="ok">${escapeHtml(caps.level || '?')}</em>`);
  addRow('system', 'system=&gt;', `agent: provider=<code>${escapeHtml(agent.provider || '(none)')}</code> model=<code>${escapeHtml(agent.model || '(none)')}</code>`);
  const providers = caps.providers || {};
  const ollama = providers.ollama || {};
  if (ollama.reachable) {
    const n = Array.isArray(ollama.models) ? ollama.models.length : 0;
    addRow('system', 'system=&gt;', `ollama: <em class="ok">reachable</em> at <code>${escapeHtml(ollama.endpoint || '?')}</code> · ${n} model${n === 1 ? '' : 's'} pulled`);
  } else if (ollama.disabled) {
    addRow('system', 'system=&gt;', `ollama: <em class="fail">disabled</em>`);
  } else {
    addRow('system', 'system=&gt;', `ollama: <em class="fail">unreachable</em>`);
  }
  for (const p of ['anthropic', 'openai', 'gemini']) {
    const info = providers[p];
    if (info && info.token) {
      addRow('system', 'system=&gt;', `${p}: <em class="ok">token configured</em>`);
    }
  }
  if (caps.ferricula && caps.ferricula.reachable) {
    addRow('system', 'system=&gt;', `ferricula: <em class="ok">reachable</em>`);
  } else {
    addRow('system', 'system=&gt;', `ferricula: <em class="fail">unreachable</em>`);
  }
}

async function cmdDoctor() {
  // Same data as show-config but framed as a readiness probe with
  // pass/fail icons per check. Local — does not run any tool calls.
  const caps = await freshCaps();
  if (!caps) {
    addRow('error', 'err!', 'doctor: capabilities probe failed');
    return;
  }
  const agent = caps.agent || {};
  const ollama = (caps.providers && caps.providers.ollama) || {};
  const providers = caps.providers || {};
  const hasAnyToken = ['anthropic', 'openai', 'gemini'].some(p => providers[p] && providers[p].token);
  const modelInstalled = agent.provider === 'ollama'
    ? (Array.isArray(ollama.models) && ollama.models.includes(agent.model))
    : !!agent.model;

  addRow('system', 'system=&gt;', '— readiness probe —');
  const ollamaStatusText = ollama.disabled ? 'disabled' : (ollama.reachable ? 'reachable' : 'unreachable');
  const ollamaIcon = ollama.reachable ? '<em class="ok">✓</em>' : '<em class="fail">✗</em>';
  addRow('system', 'system=&gt;', `  ${ollamaIcon} ollama: ${ollamaStatusText}`);
  addRow('system', 'system=&gt;', `  ${hasAnyToken ? '<em class="ok">✓</em>' : '<em class="fail">✗</em>'} frontier token (any of anthropic / openai / gemini)`);
  addRow('system', 'system=&gt;', `  ${modelInstalled ? '<em class="ok">✓</em>' : '<em class="fail">✗</em>'} configured model is reachable: <code>${escapeHtml(agent.provider || '?')}/${escapeHtml(agent.model || '?')}</code>`);
  addRow('system', 'system=&gt;', `  ${(caps.ferricula && caps.ferricula.reachable) ? '<em class="ok">✓</em>' : '<em class="fail">✗</em>'} ferricula reachable`);
  addRow('system', 'system=&gt;', `boot level: <em class="ok">${escapeHtml(caps.level)}</em>`);
}

async function cmdVersion() {
  const caps = await freshCaps();
  addRow('system', 'system=&gt;', `hyperia sidecar <code>v${escapeHtml(caps && caps.sidecar || '?')}</code>`);
}

function cmdShowCommands() {

    ['change model',  'open the model picker'],

async function cmdResetConversation() {
  try {
    const r = await fetch('/api/ghost/reset', { method: 'POST' });
    if (!r.ok) {
      addRow('error', 'err!', 'reset failed: HTTP ' + r.status);

async function cmdWipeConfig() {

async function cmdContinue() {

function setBusy(b) {
  promptline.classList.toggle('busy', b);
  hint.innerHTML = b
    ? '<b>▶ thinking…</b>  <kbd>esc</kbd> stop  · type to queue'
    : '<kbd>↵</kbd> send · <kbd>⇧↵</kbd> newline · <kbd>esc</kbd> stop';
  if (!b) setTimeout(() => input.focus(), 0);
}

function clearScreen() {
  screen.innerHTML = '';
  addWatercooler('screen cleared');
}

// ───────────────────────────────────────────────────────────────────────
// History seed + capabilities probe + boot
// ───────────────────────────────────────────────────────────────────────
async function seedHistory() {
  try {
    const r = await fetch('/api/ghost/history');
    if (!r.ok) return;
    const j = await r.json();
    const msgs = (j.messages || []).slice(-50);
    for (const m of msgs) {
      const role = m.role === 'assistant' ? 'agent' : 'user';
      const label = role === 'agent' ? 'hyperia~&gt;' : 'you~&gt;';
      let content = m.content || '';
      if (role === 'agent' && content.startsWith('[Thinking:')) {
        const endIdx = content.indexOf(']\n\n');
        if (endIdx !== -1) {
          const thought = content.slice(10, endIdx);
          const reply = content.slice(endIdx + 3);

          const thoughtId = 'hist_think_' + Math.random().toString(36).substring(2, 9);
          addThinkingRow(thoughtId);
          streamThinkingText(thoughtId, thought);
          finishThinkingRow(thoughtId);

          // Collapse historical thoughts by default
          const rEl = document.getElementById('thinking-' + thoughtId);
          if (rEl) {
            rEl.classList.remove('expanded');
            rEl.querySelector('.output').style.display = 'none';
          }

          addRow(role, label, escapeHtml(reply).replace(/\n/g, '<br>'));
          continue;
        }
      }
      const displayContent = role === 'user' ? redactTokensInText(content) : content;
      addRow(role, label, escapeHtml(displayContent).replace(/\n/g, '<br>'));
    }
  } catch (_) { /* no history is fine */ }
}

async function bootCapabilities() {
  let caps = null;
  try {
    const r = await fetch('/api/ghost/capabilities');
    if (r.ok) caps = await r.json();
  } catch (_) {}

  // Status strip + cached level for dispatch
  $('s-sidecar').textContent  = (caps && caps.sidecar)  ? 'v' + caps.sidecar : '?';
  $('s-level').textContent    = (caps && caps.level)    ? caps.level         : '?';
  const modelName  = (caps && caps.agent && caps.agent.model)    ? caps.agent.model    : '(none)';
  const providerNm = (caps && caps.agent && caps.agent.provider) ? caps.agent.provider : '';
  const ollamaModels = (caps && caps.providers && caps.providers.ollama && Array.isArray(caps.providers.ollama.models))
    ? caps.providers.ollama.models : [];
  const modelInstalled = providerNm === 'ollama'
    ? ollamaModels.includes(modelName)
    : true;
  const modelEl = $('s-model');
  modelEl.textContent = modelName;
  // Strip any prior warn span and append fresh if needed.
  const modelItem = $('s-model-item');
  modelItem.querySelectorAll('.warn').forEach(el => el.remove());
  const ollamaDisabled = caps && caps.providers && caps.providers.ollama && caps.providers.ollama.disabled;
  if (providerNm === 'ollama' && ollamaModels.length && !modelInstalled && !ollamaDisabled) {
    const warn = document.createElement('span');
    warn.className = 'warn';
    warn.textContent = '(not pulled)';
    modelItem.appendChild(warn);
  }
  if (caps && caps.level) currentLevel = caps.level;
  const fcItem = $('s-ferricula').parentElement;
  fcItem.classList.remove('live', 'dead');
  if (caps && caps.ferricula) {
    fcItem.classList.add(caps.ferricula.reachable ? 'live' : 'dead');
    $('s-ferricula').textContent = caps.ferricula.reachable ? 'live' : 'unreachable';
  } else {
    $('s-ferricula').textContent = '?';
  }
  // Cache capabilities for the picker click handler.
  window.__caps__ = caps;
  // Auto-prompt model picker on first capabilities load if configured model
  // isn't installed and we have alternatives.
  if (!modelInstalled && providerNm === 'ollama' && ollamaModels.length && !window.__model_prompted__) {
    window.__model_prompted__ = true;
    addRow('system', 'system=&gt;', `configured model <code>${escapeHtml(modelName)}</code> isn't pulled in ollama. <em class="path">click "model" in the status bar</em> to pick one of: ${ollamaModels.map(m => '<code>' + escapeHtml(m) + '</code>').join(', ')}.`);
  }

  if (!caps) {
    addRow('error', 'err!', 'could not reach sidecar at /api/ghost/capabilities');
    return null;
  }

  // Boot lines
  addRow('system', 'system=&gt;', `hyperia sidecar <code>v${escapeHtml(caps.sidecar)}</code>`);
  const provider = caps.agent && caps.agent.provider ? caps.agent.provider : '(none)';
  const model    = caps.agent && caps.agent.model    ? caps.agent.model    : '(none)';
  const ollama = caps.providers && caps.providers.ollama;
  if (ollama && ollama.reachable) {
    addRow('system', 'system=&gt;', `ollama: <em class="ok">reachable</em> at <code>${escapeHtml(ollama.endpoint || '')}</code>`);
  } else if (ollama && ollama.disabled) {
    addRow('system', 'system=&gt;', `ollama: <em class="fail">disabled</em>`);
  } else {
    addRow('system', 'system=&gt;', `ollama: <em class="fail">unreachable</em>`);
  }
  if (caps.ferricula && caps.ferricula.reachable) {
    addRow('system', 'system=&gt;', `ferricula: <em class="ok">reachable</em>`);
  } else {
    addRow('system', 'system=&gt;', `ferricula: <em class="fail">unreachable</em>`);
  }
  addRow('system', 'system=&gt;', `agent: provider=<code>${escapeHtml(provider)}</code> model=<code>${escapeHtml(model)}</code>`);
  addRow('system', 'system=&gt;', `level: <em class="ok">${escapeHtml(caps.level)}</em>`);
  return caps;
}

// Post any uncaught JS error from the shell pane up to the sidecar's
// /api/log so it lands in ~/.hyperia/logs/sidecar.log.YYYY-MM-DD. The web
// pane has no devtools by default and crashes here used to be invisible;
// /api/log keeps a record. Ported from the legacy ghost.ts wireup.
function postClientLog(level, msg, extra) {
  try {
    fetch('/api/log', {
      method: 'POST',
      headers: {'content-type': 'application/json'},
      body: JSON.stringify({ source: 'shell', level, message: String(msg), extra: extra || null }),
    }).catch(() => {});
  } catch (_) {}
}
window.addEventListener('error', (e) => {
  postClientLog('error', e.message || String(e.error), {
    filename: e.filename, lineno: e.lineno, colno: e.colno,
  });
});
window.addEventListener('unhandledrejection', (e) => {
  postClientLog('error', 'unhandled promise rejection: ' + (e.reason && e.reason.message || String(e.reason)));
});

// If the sidecar thinks an agent run is still in flight (e.g. the previous
// shell pane was closed mid-stream and the agent never got a clean exit),
// reset it on boot so the user isn't blocked from sending new messages.
// Ported from ghost.ts which did the same check via /api/ghost/status.
async function maybeAutoResetIfStale() {
  try {
    const r = await fetch('/api/ghost/status');
    if (!r.ok) return;
    const j = await r.json();
    if (j.state === 'running') {
      await fetch('/api/ghost/reset', { method: 'POST' });
      addRow('system', 'system=&gt;', 'previous session left in <em class="fail">running</em> state — reset.');
    }
  } catch (_) {}
}

async function boot() {
  await maybeAutoResetIfStale();
  const caps = await bootCapabilities();
  await seedHistory();
  await seedAssets();
  const greeting = (() => {
    if (!caps) return "no sidecar capabilities — i'll wait here.";
    const ollama = caps.providers && caps.providers.ollama || {};
    const ollamaDisabled = ollama.disabled;
    const ollamaReachable = ollama.reachable;

    switch (caps.level) {
      case 'hybrid':
        return "ready. frontier + local both online. ask anything.";
      case 'frontier':
        return ollamaDisabled
          ? "ready on frontier."
          : (ollamaReachable ? "ready on frontier." : "ready on frontier. install ollama for a local compressor.");
      case 'local':
        return "ready on local model. planning will feel slower than frontier; paste an anthropic / openai / gemini token to upgrade.";
      case 'none':
      default:
        if (ollamaDisabled) {
          return "Ollama is disabled via configuration. To activate the Hyperia agent, please configure an API token from one of the following providers: OpenAI (paste <code>sk-…</code>), Anthropic (paste <code>sk-ant-…</code>), or Gemini (paste <code>AIza…</code>). Typing <code>what's possible</code> walks through options.";
        } else if (!ollamaReachable) {
          return "Ollama is unreachable or not running, and no provider tokens are configured. Please start Ollama or configure an API token from OpenAI (paste <code>sk-…</code>), Anthropic (paste <code>sk-ant-…</code>), or Gemini (paste <code>AIza…</code>). Typing <code>what's possible</code> walks through options.";
        }
        return "i don't have a brain wired yet. try <code>install ollama</code> for a local model, or <code>paste anthropic token sk-ant-…</code> for a frontier one. typing <code>what's possible</code> walks through options.";
    }
  })();
  addRow('agent', 'hyperia~&gt;', greeting);
  setBusy(false);
  setTimeout(() => input.focus(), 0);
}

// ───────────────────────────────────────────────────────────────────────
// Model picker — click the model field in the status strip to swap
// ───────────────────────────────────────────────────────────────────────
function openModelPicker() {
  const caps = window.__caps__;
  if (!caps) {
    addRow('error', 'err!', 'no capabilities cached — refresh the page');
    return;
  }
  // Build option list: all configured providers, with their models if known.
  const options = [];
  const ollama = caps.providers && caps.providers.ollama;
  if (ollama && ollama.reachable && Array.isArray(ollama.models)) {
    for (const m of ollama.models) {
      options.push({ provider: 'ollama', model: m, label: 'ollama · ' + m });
    }
  }
  // For frontier providers we don't have a model list (model_catalog tool
  // owns that), so just offer a default per provider that has a token.
  const frontierDefaults = {
    anthropic: 'claude-sonnet-4-6',
    openai:    'gpt-4o',
    gemini:    'gemini-2.0-flash',
  };
  for (const p of ['anthropic', 'openai', 'gemini']) {
    const pInfo = caps.providers && caps.providers[p];
    const hasToken = !!(pInfo && pInfo.token);
    const suffix = hasToken ? '' : ' (no token)';
    options.push({
      provider: p,
      model: frontierDefaults[p],
      label: p + ' · ' + frontierDefaults[p] + suffix
    });
  }
  if (!options.length) {
    const ollamaDisabled = caps.providers && caps.providers.ollama && caps.providers.ollama.disabled;
    const msg = ollamaDisabled
      ? 'no models available — no frontier token configured. paste a token from openai, anthropic or gemini in the prompt to get started.'
      : 'no models available — no frontier token configured and no ollama models pulled. type <code>install ollama</code> in the prompt to get started.';
    addRow('system', 'system=&gt;', msg);
    return;
  }
  // Render an inline picker row (reuse show_widget styling).
  const r = document.createElement('div');
  r.className = 'row widget';
  let body = '<div class="prompt">? pick a model</div>';
  options.forEach((o, i) => {
    body += `<div class="option" data-provider="${escapeHtml(o.provider)}" data-model="${escapeHtml(o.model)}">
      <span class="key">[${i + 1}]</span>${escapeHtml(o.label)}
    </div>`;
  });
  body += '<div class="actions"><button class="dismiss">dismiss</button></div>';
  r.innerHTML = body;
  screen.appendChild(r);
  autoscroll();
  r.querySelectorAll('.option').forEach(el => {
    el.addEventListener('click', async () => {
      r.classList.add('submitted');
      r.querySelectorAll('button, .option').forEach(x => x.disabled = true);
      const resp = document.createElement('div');
      resp.className = 'response';
      resp.textContent = '✓ ' + el.dataset.provider + ' · ' + el.dataset.model;
      r.appendChild(resp);
      try {
        const ok = await fetch('/api/ghost/set-model', {
          method: 'POST',
          headers: {'content-type': 'application/json'},
          body: JSON.stringify({ provider: el.dataset.provider, model: el.dataset.model }),
        });
        if (!ok.ok) {
          const j = await ok.json().catch(() => ({}));
          addRow('error', 'err!', 'set-model failed: ' + escapeHtml(j.error || ('HTTP ' + ok.status)));
          return;
        }
      } catch (e) {
        addRow('error', 'err!', 'set-model failed: ' + escapeHtml(e.message));
        return;
      }
      addRow('system', 'system=&gt;', `agent re-pointed at <code>${escapeHtml(el.dataset.provider)}/${escapeHtml(el.dataset.model)}</code>. next message uses the new model.`);
      // Re-probe capabilities so the status bar updates.
      await bootCapabilities();
    });
  });
  r.querySelector('button.dismiss').addEventListener('click', () => {
    r.classList.add('submitted');
    r.querySelectorAll('button, .option').forEach(x => x.disabled = true);
    const resp = document.createElement('div');
    resp.className = 'response';
    resp.style.color = 'var(--text-faint)';
    resp.textContent = '× dismissed';
    r.appendChild(resp);
  });
}
$('s-model-item').addEventListener('click', openModelPicker);
$('hud-reset').addEventListener('click', () => {
  STATS.in = 0;
  STATS.out = 0;
  STATS.tools = 0;
  STATS.turns = 0;
  turn_in = 0;
  turn_out = 0;
  updateHud();
});

updateHud();
autoresize();
boot();
</script>
