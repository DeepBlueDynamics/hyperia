[package]
name = "lume"
version = "0.10.0"
edition = "2021"
description = "Lume: local FST-backed tagger + BM25 search. Library-only slice for Hyperia internals (per-shell log search, sticky-note search). No CLI, no network."

[dependencies]
tantivy-fst = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# This is the lib-only, network-free slice of lume used inside Hyperia. The CLI
# (src/main.rs) and the cloud-backed modules (inversion.rs, hybrid.rs,
# semantic.rs) live in the upstream lume repo and are intentionally NOT compiled
# here — they pull in `ureq` and call shivvr.nuts.services. Hyperia's two
# consumers (shell-log search, sticky search) only need local BM25.

[profile.release]
lto = true
codegen-units = 1
