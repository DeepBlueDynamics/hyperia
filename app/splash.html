<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; }
body { background: transparent; overflow: hidden; cursor: none; }
canvas { display: block; }
#title {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Segoe UI', -apple-system, sans-serif;
  font-size: 72px;
  font-weight: 200;
  letter-spacing: 24px;
  color: #fff;
  opacity: 0;
  text-shadow: 0 0 40px rgba(70, 140, 255, 0.6), 0 0 80px rgba(70, 140, 255, 0.3);
  pointer-events: none;
  z-index: 10;
}
#title-tm {
  position: absolute;
  top: -18px; right: -22px;
  font-size: 14px;
  font-weight: 300;
  letter-spacing: 0;
  color: rgba(255,255,255,0.55);
  text-shadow: none;
}
#brand {
  position: absolute;
  top: calc(50% + 52px); left: 50%;
  transform: translateX(-50%);
  font-family: 'Segoe UI', -apple-system, sans-serif;
  font-size: 13px;
  font-weight: 300;
  letter-spacing: 3px;
  text-transform: uppercase;
  opacity: 0;
  pointer-events: none;
  z-index: 10;
  white-space: nowrap;
}
#fade {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: #000;
  opacity: 0;
  pointer-events: none;
  z-index: 20;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">HYPERIA</div>
<div id="brand"><span style="color:#fff">Deep</span><span style="color:#468cff">Blue</span> <span style="color:#888">Dynamics, LLC</span></div>
<div id="fade"></div>
<script>
// --- Weber's Electrodynamics Particle Simulation ---
// F = kq1q2/r^2 * [1 - (dr/dt)^2/c^2 + 2r(d2r/dt2)/c^2]

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const title = document.getElementById('title');
const brand = document.getElementById('brand');
const fade = document.getElementById('fade');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Physics constants (scaled for visual effect)
const C = 600;        // speed of light (pixels/s)
const K = 8000;       // Coulomb constant (scaled)
const DT = 0.016;     // timestep
const DAMPING = 0.998;
const N = 40;         // particle count

// Particle class
class Particle {
  constructor() {
    const angle = Math.random() * Math.PI * 2;
    const radius = 100 + Math.random() * 250;
    this.x = W / 2 + Math.cos(angle) * radius;
    this.y = H / 2 + Math.sin(angle) * radius;
    this.vx = (Math.random() - 0.5) * 100;
    this.vy = (Math.random() - 0.5) * 100;
    this.ax = 0;
    this.ay = 0;
    this.prevAx = 0;
    this.prevAy = 0;
    this.q = (Math.random() > 0.5 ? 1 : -1) * (0.5 + Math.random() * 0.5);
    this.mass = 1 + Math.random() * 2;
    this.trail = [];
    this.maxTrail = 12;
    // Color palette — pick from several families
    const palette = Math.floor(Math.random() * 5);
    if (palette === 0) {
      // Electric blue
      this.r = 70 + Math.random() * 40;
      this.g = 140 + Math.random() * 60;
      this.b = 255;
    } else if (palette === 1) {
      // Hot pink / magenta
      this.r = 220 + Math.random() * 35;
      this.g = 50 + Math.random() * 40;
      this.b = 180 + Math.random() * 75;
    } else if (palette === 2) {
      // Cyan / teal
      this.r = 30 + Math.random() * 30;
      this.g = 200 + Math.random() * 55;
      this.b = 220 + Math.random() * 35;
    } else if (palette === 3) {
      // Gold / amber
      this.r = 240 + Math.random() * 15;
      this.g = 180 + Math.random() * 50;
      this.b = 40 + Math.random() * 40;
    } else {
      // Green
      this.r = 50 + Math.random() * 40;
      this.g = 220 + Math.random() * 35;
      this.b = 100 + Math.random() * 50;
    }
  }
}

const particles = [];
for (let i = 0; i < N; i++) particles.push(new Particle());

// Add a few heavy "nucleus" particles at center
for (let i = 0; i < 5; i++) {
  const p = new Particle();
  p.x = W / 2 + (Math.random() - 0.5) * 75;
  p.y = H / 2 + (Math.random() - 0.5) * 75;
  p.q = (i % 2 === 0 ? 3 : -3);
  p.mass = 10;
  p.vx = (Math.random() - 0.5) * 20;
  p.vy = (Math.random() - 0.5) * 20;
  p.r = 160; p.g = 80; p.b = 255;
  p.maxTrail = 20;
  particles.push(p);
}

// ™ node — orbits in the field like any other particle
const tmParticle = new Particle();
tmParticle.x = W / 2 + 180;
tmParticle.y = H / 2 - 80;
tmParticle.vx = 20;
tmParticle.vy = 60;
tmParticle.q = 1.5;
tmParticle.mass = 3;
tmParticle.r = 200; tmParticle.g = 200; tmParticle.b = 255;
tmParticle.isTm = true;
tmParticle.maxTrail = 16;
particles.push(tmParticle);

function weberForce(p1, p2) {
  const dx = p2.x - p1.x;
  const dy = p2.y - p1.y;
  const r2 = dx * dx + dy * dy;
  const r = Math.sqrt(r2);
  if (r < 5) return { fx: 0, fy: 0 };

  const rHat_x = dx / r;
  const rHat_y = dy / r;

  // Radial velocity: dr/dt
  const dvx = p2.vx - p1.vx;
  const dvy = p2.vy - p1.vy;
  const rdot = (dx * dvx + dy * dvy) / r;

  // Radial acceleration: d2r/dt2
  const dax = p2.ax - p1.ax;
  const day = p2.ay - p1.ay;
  const rddot = (dx * dax + dy * day) / r;

  // Weber's force: F = kq1q2/r^2 * [1 - rdot^2/c^2 + 2*r*rddot/c^2]
  const c2 = C * C;
  const weberFactor = 1 - (rdot * rdot) / c2 + (2 * r * rddot) / c2;
  const F = K * p1.q * p2.q / r2 * weberFactor;

  // Soft repulsion at close range
  const softRepel = r < 20 ? 5000 / (r * r) : 0;

  const totalF = F + softRepel;
  return {
    fx: -totalF * rHat_x,
    fy: -totalF * rHat_y
  };
}

function step() {
  // Save previous accelerations
  for (const p of particles) {
    p.prevAx = p.ax;
    p.prevAy = p.ay;
    p.ax = 0;
    p.ay = 0;
  }

  // Compute forces
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const f = weberForce(particles[i], particles[j]);
      particles[i].ax += f.fx / particles[i].mass;
      particles[i].ay += f.fy / particles[i].mass;
      particles[j].ax -= f.fx / particles[j].mass;
      particles[j].ay -= f.fy / particles[j].mass;
    }
  }

  // Gentle pull toward center
  const cx = W / 2, cy = H / 2;
  for (const p of particles) {
    const dx = cx - p.x;
    const dy = cy - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 315) {
      p.ax += dx * 0.3;
      p.ay += dy * 0.3;
    }

    // Integrate
    p.vx = (p.vx + p.ax * DT) * DAMPING;
    p.vy = (p.vy + p.ay * DT) * DAMPING;
    p.x += p.vx * DT;
    p.y += p.vy * DT;

    // Trail
    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > p.maxTrail) p.trail.shift();
  }
}

function draw() {
  // Fade the previous frame toward TRANSPARENT (not black) so the splash window
  // stays see-through. 'destination-out' erases ~15% alpha per frame, preserving
  // the motion-blur trail look without painting an opaque background.
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  // Draw field lines (connections between nearby opposite charges)
  ctx.lineWidth = 0.5;
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const a = particles[i], b = particles[j];
      if (a.q * b.q >= 0) continue; // only opposite charges
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d > 120) continue;
      const alpha = Math.max(0, 0.15 * (1 - d / 120));
      ctx.strokeStyle = `rgba(100, 160, 255, ${alpha})`;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
  }

  // Draw particles with trails
  for (const p of particles) {
    // Trail
    for (let i = 0; i < p.trail.length - 1; i++) {
      const t = i / p.trail.length;
      ctx.strokeStyle = `rgba(${p.r}, ${p.g}, ${p.b}, ${t * 0.3})`;
      ctx.lineWidth = t * 2;
      ctx.beginPath();
      ctx.moveTo(p.trail[i].x, p.trail[i].y);
      ctx.lineTo(p.trail[i + 1].x, p.trail[i + 1].y);
      ctx.stroke();
    }

    if (p.isTm) {
      // ™ glow halo
      const tmGlow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 22);
      tmGlow.addColorStop(0, `rgba(${p.r}, ${p.g}, ${p.b}, 0.45)`);
      tmGlow.addColorStop(0.5, `rgba(${p.r}, ${p.g}, ${p.b}, 0.1)`);
      tmGlow.addColorStop(1, `rgba(${p.r}, ${p.g}, ${p.b}, 0)`);
      ctx.fillStyle = tmGlow;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 22, 0, Math.PI * 2);
      ctx.fill();
      // ™ text
      ctx.font = '600 13px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = `rgb(${p.r}, ${p.g}, ${p.b})`;
      ctx.fillText('™', p.x, p.y);
    } else {
      // Glow
      const size = Math.abs(p.q) * 3 + 1;
      const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 6);
      glow.addColorStop(0, `rgba(${p.r}, ${p.g}, ${p.b}, 0.6)`);
      glow.addColorStop(0.4, `rgba(${p.r}, ${p.g}, ${p.b}, 0.15)`);
      glow.addColorStop(1, `rgba(${p.r}, ${p.g}, ${p.b}, 0)`);
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(p.x, p.y, size * 6, 0, Math.PI * 2);
      ctx.fill();

      // Core
      ctx.fillStyle = `rgb(${p.r}, ${p.g}, ${p.b})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// --- Timeline ---
const START = performance.now();
const TITLE_FADE_IN = 800;    // ms - title starts fading in
const TITLE_FULL = 2000;      // ms - title fully visible
const MIN_SHOW_MS = 6000;     // ms - minimum time splash is visible

let signaled = false;
let appReady = false;
let readyToClose = false;
let fadeStartTime = 0;
const FADE_DURATION = 600;    // ms - fade out duration

function loop() {
  const elapsed = performance.now() - START;

  step();
  draw();

  // Title + brand fade in
  if (elapsed > TITLE_FADE_IN && !readyToClose) {
    const t = Math.min(1, (elapsed - TITLE_FADE_IN) / (TITLE_FULL - TITLE_FADE_IN));
    title.style.opacity = t;
    brand.style.opacity = t * 0.7;
  }

  // Don't close until minimum time has passed AND app is ready
  if (appReady && elapsed >= MIN_SHOW_MS && !readyToClose) {
    readyToClose = true;
  }

  // When app signals ready, start fade out
  if (readyToClose && fadeStartTime === 0) {
    fadeStartTime = performance.now();
  }

  if (fadeStartTime > 0) {
    const fadeElapsed = performance.now() - fadeStartTime;
    const t = Math.min(1, fadeElapsed / FADE_DURATION);
    fade.style.opacity = t;
    title.style.opacity = 1 - t;
    brand.style.opacity = (1 - t) * 0.7;

    // Signal done after fade completes
    if (t >= 1 && !signaled) {
      signaled = true;
      if (window.electronAPI) {
        window.electronAPI.splashDone();
      }
    }
  }

  if (!signaled) {
    requestAnimationFrame(loop);
  }
}

// Listen for app ready signal
if (window.electronAPI) {
  window.electronAPI.onAppReady(() => {
    appReady = true;
  });
}

// Allow click/key to skip minimum wait
document.addEventListener('click', () => { appReady = true; readyToClose = true; });
document.addEventListener('keydown', () => { appReady = true; readyToClose = true; });

requestAnimationFrame(loop);
</script>
</body>
</html>
