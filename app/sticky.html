<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sticky</title>
<link id="hlTheme" rel="stylesheet" href="atom-one-light.min.css">
<style>
  /* hljs bg always transparent — note background is set by JS */
  .hljs { background: transparent !important; }
  .ai-highlight-banner {
    font-size: 10px;
    opacity: 0.6;
    padding: 2px 8px;
    flex-shrink: 0;
    font-style: italic;
  }
  .ai-highlight-banner.loading { opacity: 0.8; }
  .ai-spinner { display: inline-block; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<!-- highlight.js for code-note syntax highlighting. Vendored locally (v11.9.0,
     app/highlight.min.js copied to target by webpack) so highlighting works
     offline and never depends on a CDN that a slow/blocked network can drop. -->
<script src="highlight.min.js"></script>
<style>
  :root {
    --sticky-font-size: 22px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    /* color set dynamically by textColorForBg() */
    font-family: 'Cascadia Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
    font-size: var(--sticky-font-size);
    display: flex;
    flex-direction: column;
  }
  .titlebar {
    min-height: 22px;
    height: auto;
    display: flex;
    align-items: center;
    padding: 4px 4px 4px 8px;
    -webkit-app-region: drag;
    flex-shrink: 0;
    font-size: var(--sticky-title-font-size, 14px);
    user-select: none;
    background: rgba(0,0,0,0.08);
  }
  .titlebar-text {
    flex: 0 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: inherit;
    font-size: var(--sticky-title-font-size, 14px);
    font-weight: bold;
    opacity: 0.7;
    /* Clickable (copy name) — must NOT be in the window-drag region, or the
       OS eats single clicks for window-dragging. The spacer below keeps the
       window draggable. */
    -webkit-app-region: no-drag;
    cursor: pointer;
  }
  /* Draggable filler between the title and the buttons so the frameless window
     can still be moved (the title + buttons are all no-drag). */
  .titlebar-spacer {
    flex: 1;
    align-self: stretch;
    min-width: 16px;
  }
  .titlebar-input {
    flex: 0 1 auto;
    min-width: 120px;
    background: transparent;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: var(--sticky-title-font-size, 14px);
    font-weight: bold;
    color: inherit;
    padding: 0;
    margin: 0;
    height: 100%;
    -webkit-app-region: no-drag;
    opacity: 0.9;
  }
  .titlebar-btn {
    width: calc(var(--sticky-title-font-size, 14px) + 8px);
    height: calc(var(--sticky-title-font-size, 14px) + 8px);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    cursor: pointer;
    -webkit-app-region: no-drag;
    font-size: calc(var(--sticky-title-font-size, 14px) + 3px);
    opacity: 0.7;
    transition: opacity 0.15s, background 0.15s;
    z-index: 100;
    line-height: 1;
  }
  .titlebar-btn:hover { opacity: 1; }
  .close-btn { font-weight: bold; }
  .close-btn:hover { background: rgba(180, 0, 0, 0.25); }
  .lines-btn:hover { background: rgba(128, 128, 128, 0.2); }
  .search-btn:hover { background: rgba(128, 128, 128, 0.2); }

  /* Link bar */
  .link-bar {
    display: none;
    flex-direction: column;
    flex-shrink: 0;
    background: rgba(0,0,0,0.06);
    border-bottom: 1px solid rgba(0,0,0,0.08);
    font-size: 10px;
    padding: 2px 4px;
    gap: 1px;
  }
  .link-bar.visible { display: flex; }
  .link-row {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
    height: 16px;
  }
  .link-icon { opacity: 0.5; flex-shrink: 0; font-size: 9px; }
  .link-label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    opacity: 0.75;
    cursor: pointer;
    font-family: inherit;
  }
  .link-label:hover { opacity: 1; text-decoration: underline; }
  .link-action {
    flex-shrink: 0;
    cursor: pointer;
    opacity: 0.45;
    font-size: 10px;
    padding: 0 2px;
    border-radius: 2px;
    transition: opacity 0.1s;
    -webkit-app-region: no-drag;
  }
  .link-action:hover { opacity: 1; background: rgba(128,128,128,0.2); }
  .link-action.disabled { opacity: 0.2; cursor: default; }
  .link-action.disabled:hover { background: none; }

  .content {
    flex: 1;
    overflow: hidden;
    padding: 4px 6px 6px 8px;
    display: flex;
    flex-direction: column;
  }

  /* Wrapper holding the highlight backdrop, the textarea, and the tick rail
     in one positioned box so find can light up matches behind the live text
     (a textarea can't style ranges itself). */
  .note-find-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    display: block;
  }
  /* Mirror of the note text rendered BEHIND the textarea. Only the <mark>
     backgrounds are visible (text is transparent); the textarea on top is
     transparent-background so the highlights show through under the real
     text. Scrolled in lock-step with the textarea. */
  .find-highlights {
    position: absolute;
    inset: 0;
    margin: 0;
    padding-right: 4px;
    font-family: inherit;
    font-size: var(--sticky-font-size);
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
    tab-size: 2;
    overflow: hidden;
    color: transparent;
    pointer-events: none;
    z-index: 0;
  }
  .find-highlights mark {
    background: rgba(255, 235, 59, 0.55); /* all matches: yellow */
    color: transparent;
    border-radius: 2px;
  }
  .find-highlights mark.current {
    background: rgba(255, 145, 0, 0.9); /* active match: orange */
  }
  /* Syntax-highlight mode: the backdrop renders VISIBLE highlight.js HTML
     (the textarea text on top is made transparent so these colors show). The
     hljs theme CSS (atom-one-*) styles the .hljs-* spans; base text inherits
     the note's theme color. */
  .find-highlights.syntax {
    color: inherit;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  /* Links underlined while Ctrl/Cmd is held (the text stays transparent in the
     backdrop; the explicit decoration color makes the underline visible under
     the real text in the textarea on top). */
  .find-highlights .ctrl-link {
    text-decoration: underline;
    text-decoration-color: #2b7de9;
    text-decoration-thickness: 1.5px;
    text-underline-offset: 2px;
  }
  /* Scrollbar tick rail (Chrome-style) — shows where matches sit in the full
     document. Only populated when the note actually overflows (has a scroll). */
  .find-tickrail {
    position: absolute;
    top: 0;
    right: 0;
    width: 6px;
    height: 100%;
    pointer-events: none;
    z-index: 2;
  }
  .find-tick {
    position: absolute;
    right: 0;
    width: 6px;
    height: 2px;
    background: rgba(255, 200, 0, 0.85);
    border-radius: 1px;
  }
  .find-tick.current {
    background: rgba(255, 110, 0, 1);
    height: 3px;
  }

  .note-text {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    border: none;
    background: transparent;
    color: inherit;
    font-family: inherit;
    font-size: var(--sticky-font-size);
    resize: none;
    outline: none;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
    tab-size: 2;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 4px;
  }

  /* Slim color-coded scrollbars */
  .note-text::-webkit-scrollbar,
  pre::-webkit-scrollbar,
  .results-list::-webkit-scrollbar,
  .default-view::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  .note-text::-webkit-scrollbar-track,
  pre::-webkit-scrollbar-track,
  .results-list::-webkit-scrollbar-track,
  .default-view::-webkit-scrollbar-track {
    background: transparent;
  }
  .note-text::-webkit-scrollbar-thumb,
  pre::-webkit-scrollbar-thumb,
  .results-list::-webkit-scrollbar-thumb,
  .default-view::-webkit-scrollbar-thumb {
    background: rgba(128, 128, 128, 0.35);
    border-radius: 3px;
  }
  .note-text::-webkit-scrollbar-thumb:hover,
  pre::-webkit-scrollbar-thumb:hover,
  .results-list::-webkit-scrollbar-thumb:hover,
  .default-view::-webkit-scrollbar-thumb:hover {
    background: rgba(128, 128, 128, 0.55);
  }

  pre {
    margin: 0;
    flex: 1;
    font-family: inherit;
    font-size: calc(var(--sticky-font-size) - 1px);
    line-height: 1.6;
    tab-size: 4;
    background: transparent !important;
    color: inherit;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-y: auto;
    overflow-x: hidden;
  }
  code { background: transparent !important; }

  .with-lines { counter-reset: line; }
  .with-lines .line {
    display: block;
    counter-increment: line;
  }
  .with-lines .line::before {
    content: counter(line);
    display: inline-block;
    width: 3ch;
    margin-right: 0.75em;
    text-align: right;
    opacity: 0.3;
    font-size: 10px;
    user-select: none;
  }

  /* Search Stickys Styles */
  .search-container {
    padding: 6px 0 10px 0;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #searchInput {
    flex: 1;
    min-width: 0;
    height: 36px;
    padding: 0 12px;
    background: rgba(0,0,0,0.05);
    border: 1px solid rgba(0,0,0,0.1);
    border-radius: 6px;
    color: inherit;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #searchInput:focus {
    border-color: #bbdefb;
    box-shadow: 0 0 0 2px rgba(187, 222, 251, 0.2);
  }
  .search-refresh-btn {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.05);
    border: 1px solid rgba(0,0,0,0.1);
    border-radius: 6px;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    user-select: none;
    transition: background 0.15s, transform 0.2s;
  }
  .search-refresh-btn:hover { background: rgba(0,0,0,0.1); }
  .search-refresh-btn:active { transform: rotate(180deg); }
  /* Scheduling panel overlay */
  .sched-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.35);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    z-index: 500;
    padding: 8px;
    /* The panel sits over the titlebar's drag region; without this the OS
       drag region punches through and eats clicks on the top-row × (Cancel),
       exactly like the title-copy bug. Mark the whole modal no-drag. */
    -webkit-app-region: no-drag;
  }
  .sched-panel {
    width: 100%;
    max-width: 340px;
    background: #fbfbf6;
    color: #1a1a1a;
    border: 1px solid rgba(0,0,0,0.2);
    border-radius: 8px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.3);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 12px;
  }
  .sched-head {
    display: flex; align-items: center; justify-content: space-between;
    font-weight: bold; font-size: 13px;
  }
  .sched-close { cursor: pointer; opacity: 0.6; font-size: 16px; line-height: 1; }
  .sched-close:hover { opacity: 1; }
  .sched-row { display: flex; align-items: center; gap: 6px; }
  .sched-row label { width: 38px; flex-shrink: 0; opacity: 0.65; text-align: right; }
  .sched-row select, .sched-row input {
    flex: 1; min-width: 0; height: 26px; padding: 0 6px;
    border: 1px solid rgba(0,0,0,0.2); border-radius: 4px;
    background: #fff; color: inherit; font-family: inherit; font-size: 12px;
  }
  .sched-row input[type=number] { flex: 0 0 64px; }
  .sched-pick { cursor: pointer; padding: 3px; border-radius: 4px; }
  .sched-pick:hover { background: rgba(0,0,0,0.08); }
  .sched-note {
    font-size: 11px; opacity: 0.75; background: rgba(255,170,0,0.12);
    border: 1px solid rgba(255,170,0,0.35); border-radius: 4px; padding: 5px 7px;
  }
  .sched-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 2px; }
  .sched-btn {
    cursor: pointer; padding: 4px 12px; border-radius: 5px; font-weight: 600;
    background: #2b7de9; color: #fff;
  }
  .sched-btn:hover { background: #1c6fd6; }
  .sched-btn.ghost { background: transparent; color: #c0392b; border: 1px solid rgba(192,57,43,0.4); font-weight: 500; }
  .sched-btn.ghost:hover { background: rgba(192,57,43,0.08); }
  /* Armed (scheduled) note gets a visible border so you know it's "live". */
  body.sched-armed { box-shadow: inset 0 0 0 2px rgba(255,145,0,0.9); }
  /* File-bound note: a thin blue accent under the titlebar — edits write to disk. */
  body.file-bound .titlebar { box-shadow: inset 0 -2px 0 rgba(43,125,233,0.7); }

  .search-opt {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    opacity: 0.8;
    padding: 1px 2px;
    cursor: pointer;
    user-select: none;
  }
  .search-opt input { margin: 0; cursor: pointer; }
  .default-view { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; margin-top: 6px; }
  .action-dropdown {
    width: 100%;
    height: 32px;
    padding: 0 8px;
    background: rgba(0,0,0,0.05);
    border: 1px solid rgba(0,0,0,0.1);
    border-radius: 6px;
    color: inherit;
    font-family: inherit;
    font-size: 13px;
    outline: none;
    cursor: pointer;
  }
  .recent-heading {
    font-size: 11px;
    font-weight: bold;
    opacity: 0.5;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 2px;
  }
  /* Bar above search results with "open all" actions */
  .results-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 0 8px 0;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .results-actions .count { font-size: 11px; opacity: 0.55; margin-right: auto; }
  .results-action-btn {
    font-size: 11px;
    padding: 3px 9px;
    border: 1px solid rgba(0,0,0,0.2);
    border-radius: 5px;
    background: rgba(0,0,0,0.04);
    cursor: pointer;
    opacity: 0.85;
    -webkit-app-region: no-drag;
  }
  .results-action-btn:hover { opacity: 1; background: rgba(0,0,0,0.08); }
  .results-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-right: 2px;
  }
  .result-item {
    padding: 10px 12px;
    border-radius: 6px;
    cursor: pointer;
    background: rgba(0,0,0,0.03);
    border: 1.5px solid transparent;
    transition: all 0.1s ease;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .result-item:hover {
    border-color: rgba(0,0,0,0.1);
    background: rgba(0,0,0,0.06);
    transform: translateY(-1px);
  }
  .result-item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .result-item-title {
    font-weight: bold;
    font-size: 13px;
    color: var(--text-primary);
  }
  .result-item-color {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 0.5px solid rgba(0,0,0,0.2);
  }
  .result-item-body {
    font-size: 11px;
    opacity: 0.7;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: inherit;
  }
  .no-results {
    text-align: center;
    padding: 24px;
    font-size: 12px;
    opacity: 0.5;
  }

  .find-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    background: rgba(0, 0, 0, 0.06);
    border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    flex-shrink: 0;
    font-size: 12px;
    -webkit-app-region: no-drag;
  }
  .find-bar input {
    flex: 1;
    background: rgba(255, 255, 255, 0.85);
    border: 1px solid rgba(0, 0, 0, 0.2);
    border-radius: 3px;
    padding: 2px 6px;
    font-family: inherit;
    font-size: 12px;
    color: #000;
    outline: none;
    min-width: 80px;
  }
  .find-bar .find-count {
    font-family: 'Cascadia Code', 'JetBrains Mono', monospace;
    font-size: 11px;
    opacity: 0.6;
    min-width: 36px;
    text-align: center;
    user-select: none;
  }
  .find-bar button {
    background: transparent;
    border: 1px solid rgba(0, 0, 0, 0.2);
    border-radius: 3px;
    padding: 1px 7px;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    color: inherit;
    opacity: 0.65;
    line-height: 1.4;
  }
  .find-bar button:hover {
    opacity: 1;
    background: rgba(0, 0, 0, 0.06);
  }
</style>
</head>
<body>
  <div class="titlebar">
    <span class="titlebar-text" id="titleText"></span>
    <input type="text" class="titlebar-input" id="titleInput" style="display:none" spellcheck="false" />
    <span class="titlebar-spacer"></span>
    <span class="titlebar-btn lines-btn" id="linesBtn" style="display:none" title="Toggle line numbers">#</span>
    <span class="titlebar-btn schedule-btn" id="scheduleBtn" title="Schedule this sticky (run on a timer)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <polyline points="12 7 12 12 15 14" />
      </svg>
    </span>
    <span class="titlebar-btn search-btn" id="searchBtn" title="Find in note (Ctrl+F)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <line x1="21" y1="21" x2="16.5" y2="16.5" />
      </svg>
    </span>
    <span class="titlebar-btn file-btn" id="fileBtn" style="display:none" title="Linked to a file — click to open it">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
        <polyline points="14 2 14 8 20 8" />
      </svg>
    </span>
    <span class="titlebar-btn close-btn" id="closeBtn" title="Close (saved to closed notes)">
      <!-- Inline SVG × matching the terminal pane close button: bigger + crisper
           than the &times; glyph, same crossed-lines shape and currentColor.
           NOTE: closing a sticky does NOT delete it — it's archived to closed
           notes (sticky-close marks last_closed_at, keeps the record). -->
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </span>
  </div>
  <div class="find-bar" id="findBar" style="display:none">
    <input type="text" id="findInput" placeholder="Find in note…" spellcheck="false" />
    <span class="find-count" id="findCount">0/0</span>
    <button id="findPrev" title="Previous match (Shift+Enter)">↑</button>
    <button id="findNext" title="Next match (Enter)">↓</button>
    <button id="findClose" title="Close (Esc)">×</button>
  </div>
  <div class="ai-highlight-banner" id="aiBanner" style="display:none"></div>
  <div class="content" id="content"></div>

  <!-- Scheduling panel — picker-style overlay, opened by the ⏰ titlebar button. -->
  <div class="sched-overlay" id="schedOverlay" style="display:none">
    <div class="sched-panel">
      <div class="sched-head">
        <span>⏰ Schedule this sticky</span>
        <span class="sched-close" id="schedCancel" title="Cancel">×</span>
      </div>

      <div class="sched-row">
        <label>When</label>
        <select id="schedWhen">
          <option value="reminder">Reminder — once, after a delay</option>
          <option value="at">At — once, at a date/time</option>
          <option value="cron">Recurring — cron schedule</option>
        </select>
      </div>

      <div class="sched-row" id="rowReminder">
        <label>In</label>
        <input type="number" id="schedDelay" min="1" value="10" />
        <select id="schedUnit">
          <option value="m">minutes</option>
          <option value="h">hours</option>
          <option value="d">days</option>
        </select>
      </div>

      <div class="sched-row" id="rowAt" style="display:none">
        <label>At</label>
        <input type="datetime-local" id="schedAt" />
      </div>

      <div class="sched-row" id="rowCron" style="display:none">
        <label>Cron</label>
        <input type="text" id="schedCron" placeholder="*/15 * * * *" />
        <select id="schedCronPreset">
          <option value="">presets…</option>
          <option value="*/15 * * * *">every 15 min</option>
          <option value="0 * * * *">hourly</option>
          <option value="0 9 * * *">daily 9am</option>
          <option value="0 9 * * 1">Mondays 9am</option>
        </select>
      </div>

      <div class="sched-row">
        <label>Run</label>
        <select id="schedRunner">
          <option value="notify">Notification only (no execution)</option>
          <option value="shell">Hyperia shell — command in a new tab</option>
          <option value="n8shell">Nemesis8 shell — command in the n8 container</option>
          <option value="n8agent">Nemesis8 agent — hand the note to the agent</option>
        </select>
      </div>

      <div class="sched-row" id="rowDir" style="display:none">
        <label>Dir</label>
        <input type="text" id="schedDir" placeholder="working directory" />
        <span class="sched-pick" id="schedPickDir" title="Pick directory">📁</span>
      </div>

      <div class="sched-note" id="schedHardNote" style="display:none">
        ⚡ Scheduling with a runner locks this note read-only (a “hard” sticky) until you unschedule.
      </div>

      <div class="sched-actions">
        <span class="sched-btn ghost" id="schedUnschedule" style="display:none">Unschedule</span>
        <span class="sched-btn" id="schedConfirm">Schedule</span>
      </div>
    </div>
  </div>

<script>
const { ipcRenderer, clipboard, webFrame } = require('electron');
const fs = require('fs');
const path = require('path');
const os = require('os');

function translateContainerPath(filePath) {
  if (!filePath) return filePath;
  if (process.platform !== 'win32') return filePath;

  let normalized = filePath.replace(/\\/g, '/');
  if (normalized.startsWith('file:///')) {
    normalized = normalized.slice(8);
  } else if (normalized.startsWith('file://')) {
    normalized = normalized.slice(7);
  }

  if (normalized.startsWith('workspace/')) {
    normalized = '/' + normalized;
  }

  if (normalized.startsWith('/workspace/')) {
    const parts = normalized.slice(11).split('/');
    const workspaceName = parts[0];
    const relativePath = parts.slice(1).join('\\');

    let currentDir = process.cwd();
    try {
      const remote = require('@electron/remote');
      if (remote && remote.app) {
        currentDir = remote.app.getAppPath();
      }
    } catch (e) {}

    let projectRoot = currentDir;
    for (let i = 0; i < 5; i++) {
      if (path.basename(projectRoot).toLowerCase() === workspaceName.toLowerCase()) {
        return path.join(projectRoot, relativePath);
      }
      const parent = path.dirname(projectRoot);
      if (parent === projectRoot) break;
      projectRoot = parent;
    }

    // Fallback using package.json detection
    projectRoot = currentDir;
    for (let i = 0; i < 5; i++) {
      if (fs.existsSync(path.join(projectRoot, 'package.json'))) {
        return path.join(projectRoot, relativePath);
      }
      const parent = path.dirname(projectRoot);
      if (parent === projectRoot) break;
      projectRoot = parent;
    }
  }

  return filePath;
}

const params = new URLSearchParams(window.location.search);
const noteId = params.get('id') || '';
const filePath = translateContainerPath(params.get('file') || '');
const nameParam = params.get('name') || '';

const stickysDir = path.join(os.homedir(), '.hyperia', 'stickys');
const notesJson = path.join(stickysDir, 'notes.json');

const cfgPath = path.join(os.homedir(), '.hyperia', 'hyperia.json');

let stickyFontSize = 22; // Default to larger 22px
let stickyTitleFontSize = 14; // Default 14px (was 10 — title was too small)
const stickyDefaultsPath = path.join(stickysDir, 'defaults.json');
try {
  // Font size lives in the sticky-local defaults file, NOT hyperia.json — writing
  // it to the main config tripped Hyperia's config watcher ("config reloaded")
  // on every zoom. Read defaults.json first; fall back to the old config location
  // once (migration) for anyone whose size is still stored there.
  let d = {};
  if (fs.existsSync(stickyDefaultsPath)) {
    try { d = JSON.parse(fs.readFileSync(stickyDefaultsPath, 'utf8')) || {}; } catch (_) { d = {}; }
  }
  if (typeof d.fontSize === 'number') stickyFontSize = d.fontSize;
  if (typeof d.titleFontSize === 'number') stickyTitleFontSize = d.titleFontSize;
  if (d.fontSize == null && fs.existsSync(cfgPath)) {
    const configData = JSON.parse(fs.readFileSync(cfgPath, 'utf8'));
    if (configData && configData.config) {
      if (configData.config.stickyFontSize) stickyFontSize = configData.config.stickyFontSize;
      if (configData.config.stickyTitleFontSize) stickyTitleFontSize = configData.config.stickyTitleFontSize;
    }
  }
} catch (e) {
  console.error('Failed to load stickyFontSize and stickyTitleFontSize:', e);
}

const isSearchMode = params.get('mode') === 'search';
const currentTitleFontSize = isSearchMode ? Math.max(stickyTitleFontSize + 3, 13) : stickyTitleFontSize;

document.documentElement.style.setProperty('--sticky-font-size', `${stickyFontSize}px`);
document.documentElement.style.setProperty('--sticky-title-font-size', `${currentTitleFontSize}px`);

function saveStickyFontSize(size) {
  // Persist to the sticky-local defaults file (merged so width/height/titleFontSize
  // survive). NOT hyperia.json — that would fire the global config reload.
  try {
    let d = {};
    if (fs.existsSync(stickyDefaultsPath)) {
      try { d = JSON.parse(fs.readFileSync(stickyDefaultsPath, 'utf8')) || {}; } catch (_) { d = {}; }
    }
    d.fontSize = size;
    fs.writeFileSync(stickyDefaultsPath, JSON.stringify(d), 'utf8');
  } catch (e) {
    console.error('Failed to save stickyFontSize:', e);
  }
}

const CODE_THEMES = {
  'code:light': { bg: '#f8f8f2', text: '#383a42', css: 'atom-one-light.min.css' },
  'code:dark':  { bg: '#1e1e2e', text: '#cdd6f4', css: 'atom-one-dark.min.css'  }
};

// Compute readable text color from background using relative luminance (WCAG).
function textColorForBg(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255;
  const g = parseInt(hex.slice(3, 5), 16) / 255;
  const b = parseInt(hex.slice(5, 7), 16) / 255;
  const toLinear = c => c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  const L = 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
  return L > 0.25 ? '#1a1a1a' : '#f0f0f0';
}

// Global zoom key handler for stickies
window.addEventListener('keydown', (e) => {
  // Ctrl/Cmd+Shift+T → toggle global see-through mode for ALL stickys.
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'T' || e.key === 't')) {
    e.preventDefault();
    ipcRenderer.send('sticky-toggle-seethrough');
    return;
  }
  const isPlus = e.key === '=' || e.key === '+';
  const isMinus = e.key === '-';
  const isZero = e.key === '0';

  if ((e.ctrlKey || e.metaKey) && isPlus) {
    e.preventDefault();
    try {
      stickyFontSize = Math.min(stickyFontSize + 2, 48);
      document.documentElement.style.setProperty('--sticky-font-size', `${stickyFontSize}px`);
      saveStickyFontSize(stickyFontSize);
    } catch (err) {
      console.error(err);
    }
  } else if ((e.ctrlKey || e.metaKey) && isMinus) {
    e.preventDefault();
    try {
      stickyFontSize = Math.max(stickyFontSize - 2, 10);
      document.documentElement.style.setProperty('--sticky-font-size', `${stickyFontSize}px`);
      saveStickyFontSize(stickyFontSize);
    } catch (err) {
      console.error(err);
    }
  } else if ((e.ctrlKey || e.metaKey) && isZero) {
    e.preventDefault();
    try {
      stickyFontSize = 22;
      document.documentElement.style.setProperty('--sticky-font-size', `${stickyFontSize}px`);
      saveStickyFontSize(stickyFontSize);
    } catch (err) {
      console.error(err);
    }
  }
});

function applyBgColor(colorOrCode) {
  const theme = CODE_THEMES[colorOrCode];
  if (theme) {
    document.body.style.background = theme.bg;
    document.body.style.color = theme.text;
    document.getElementById('hlTheme').href = theme.css;
  } else {
    document.body.style.background = colorOrCode;
    document.body.style.color = textColorForBg(colorOrCode);
    document.getElementById('hlTheme').href = 'atom-one-light.min.css';
  }
}

// ── File binding (Aegis-Edit v1) ─────────────────────────────────────────────
// When a sticky is bound to a file, its body IS the file: loaded on open,
// written back (debounced) on edit. boundFilePath is the source of truth.
let boundFilePath = null;
let fileSaveTimer = null;
function setFileBound(p) {
  boundFilePath = p || null;
  const btn = document.getElementById('fileBtn');
  if (btn) {
    btn.style.display = boundFilePath ? '' : 'none';
    btn.title = boundFilePath ? ('Linked to ' + boundFilePath + ' — click to open it') : '';
  }
  document.body.classList.toggle('file-bound', !!boundFilePath);
}
function clearFileBound() { setFileBound(null); }
function saveBoundFileNow() {
  if (!boundFilePath) return;
  const ta = document.getElementById('noteText');
  if (!ta) return;
  try { fs.writeFileSync(boundFilePath, ta.value, 'utf8'); }
  catch (e) { console.error('sticky: file save failed:', e && e.message); }
}
function scheduleBoundFileSave() {
  if (!boundFilePath) return;
  clearTimeout(fileSaveTimer);
  fileSaveTimer = setTimeout(saveBoundFileNow, 500);
}

// ── AI highlight ─────────────────────────────────────────────────────────────
const agentCache = new Map(); // content hash → rules
let highlightMode = 'static'; // 'static' | 'agent' | 'off'

function simpleHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
  return h.toString(36);
}

function applyRules(content, rules) {
  // Build annotated HTML from rules applied in order
  // Mark positions to annotate
  const marks = []; // {start, end, className, color}
  for (const rule of rules) {
    try {
      const re = new RegExp(rule.pattern, rule.flags || 'g');
      let m;
      while ((m = re.exec(content)) !== null) {
        marks.push({start: m.index, end: m.index + m[0].length, className: rule.className || '', color: rule.color || ''});
        if (m[0].length === 0) re.lastIndex++;
      }
    } catch { /* invalid regex from agent — skip */ }
  }
  // Sort by start, resolve overlaps (later rules win — skip overlapping marks)
  marks.sort((a, b) => a.start - b.start);
  let out = '';
  let pos = 0;
  for (const mark of marks) {
    if (mark.start < pos) continue; // overlapping, skip
    out += escHtml(content.slice(pos, mark.start));
    const style = mark.color ? ` style="color:${mark.color}"` : '';
    out += `<span class="${mark.className}"${style}>${escHtml(content.slice(mark.start, mark.end))}</span>`;
    pos = mark.end;
  }
  out += escHtml(content.slice(pos));
  return out;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

const aiBanner = document.getElementById('aiBanner');

async function runAgentHighlight(content, codeEl) {
  const key = simpleHash(content);
  aiBanner.style.display = '';
  aiBanner.className = 'ai-highlight-banner loading';
  aiBanner.innerHTML = '<span class="ai-spinner">↻</span> AI highlighting…';

  let rules;
  if (agentCache.has(key)) {
    rules = agentCache.get(key);
  } else {
    try {
      const port = 9800;
      const resp = await fetch(`http://localhost:${port}/api/notes/highlight`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({content: content.slice(0, 4000)})
      });
      const data = await resp.json();
      rules = data.rules || [];
      agentCache.set(key, rules);
    } catch (e) {
      aiBanner.className = 'ai-highlight-banner';
      aiBanner.textContent = 'AI highlight unavailable — using auto';
      rules = null;
    }
  }

  if (rules) {
    codeEl.innerHTML = applyRules(content, rules);
    aiBanner.className = 'ai-highlight-banner';
    aiBanner.textContent = `AI highlighted · ${rules.length} rule${rules.length !== 1 ? 's' : ''}`;
  } else {
    // fallback to static
    if (window.hljs) { codeEl.textContent = content; window.hljs.highlightElement(codeEl); }
    aiBanner.style.display = 'none';
  }
}

// Split highlighted HTML into per-line spans, re-opening any hljs <span> that
// crosses a newline (block comments etc.) so neither the colors nor the line
// numbers break. Module-scope so the right-click highlight toggle can re-wrap.
function splitHighlightedLines(html) {
  const out = [];
  const open = [];
  let cur = '';
  let i = 0;
  while (i < html.length) {
    const ch = html[i];
    if (ch === '<') {
      const end = html.indexOf('>', i);
      if (end === -1) { cur += html.slice(i); break; }
      const tag = html.slice(i, end + 1);
      cur += tag;
      if (/^<span/i.test(tag)) open.push(tag);
      else if (/^<\/span/i.test(tag)) open.pop();
      i = end + 1;
    } else if (ch === '\n') {
      out.push(cur + '</span>'.repeat(open.length));
      cur = open.join('');
      i++;
    } else { cur += ch; i++; }
  }
  out.push(cur);
  return out;
}
function wrapCodeLines(codeEl) {
  const lines = splitHighlightedLines(codeEl.innerHTML);
  codeEl.innerHTML = lines.map((l) => '<span class="line">' + l + '</span>').join('');
}

function applyHighlight(content, codeEl) {
  if (highlightMode === 'off') {
    codeEl.textContent = content;
    aiBanner.style.display = 'none';
  } else if (highlightMode === 'agent') {
    runAgentHighlight(content, codeEl);
  } else {
    // static — highlight.js. Reset textContent AND clear the data-highlighted
    // marker so hljs will re-run on a toggle (otherwise it refuses + warns).
    codeEl.textContent = content;
    delete codeEl.dataset.highlighted;
    if (window.hljs) window.hljs.highlightElement(codeEl);
    aiBanner.style.display = 'none';
  }
}

// ── Inline links (no link bar) ───────────────────────────────────────────────
// A sticky is a plain text editor. URLs and note refs in the text are NOT
// listed in any bar — they're followed inline with Ctrl/Cmd+click, like a code
// editor. Plain click still just places the cursor so you can edit normally.
const URL_RE = /https?:\/\/[^\s"'<>)\]]+/g;
const NOTE_FROM_RE = /\[From:\s*([^\]]+)\]/g;      // [From: note-name-or-id]
const NOTE_URL_RE  = /app:\/\/sticky\/([^\s"'<>)\]]+)/g;

// What clickable token (if any) spans character offset `pos` in `text`.
// Returns {kind:'url'|'note', value} or null.
function linkTokenAt(text, pos) {
  const tries = [
    { re: URL_RE, kind: 'url', cap: 0 },
    { re: NOTE_URL_RE, kind: 'note', cap: 1 },
    { re: NOTE_FROM_RE, kind: 'note', cap: 1 }
  ];
  for (const {re, kind, cap} of tries) {
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(text)) !== null) {
      const start = m.index, end = start + m[0].length;
      if (pos >= start && pos <= end) {
        return { kind, value: (cap ? m[cap] : m[0]).trim() };
      }
    }
  }
  return null;
}

// All [start,end) ranges of clickable tokens (URLs + note-refs) in `text`,
// sorted by start. Used to underline links while Ctrl/Cmd is held.
function allLinkRanges(text) {
  const ranges = [];
  for (const re of [URL_RE, NOTE_FROM_RE, NOTE_URL_RE]) {
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(text)) !== null) ranges.push([m.index, m.index + m[0].length]);
  }
  ranges.sort((a, b) => a[0] - b[0]);
  return ranges;
}

// Open whatever link sits under the textarea's caret. Returns true if one was
// followed. Caller gates this on Ctrl/Cmd being held.
function followLinkInTextarea(textarea) {
  const tok = linkTokenAt(textarea.value, textarea.selectionStart);
  if (!tok) return false;
  if (tok.kind === 'url') ipcRenderer.send('sticky-open-external', tok.value);
  else ipcRenderer.send('sticky-open-note', tok.value);
  return true;
}

// Lightweight transient toast (self-contained — no HTML/CSS needed).
let _toastTimer = null;
function showToast(msg) {
  let el = document.getElementById('stickyToast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'stickyToast';
    el.style.cssText =
      'position:fixed;left:50%;bottom:14px;transform:translateX(-50%);' +
      'background:rgba(18,18,22,.94);color:#e8e8ea;font:12px/1.4 -apple-system,system-ui,sans-serif;' +
      'padding:7px 12px;border-radius:7px;box-shadow:0 4px 16px rgba(0,0,0,.45);' +
      'z-index:99999;pointer-events:none;opacity:0;transition:opacity .14s ease;max-width:90vw;' +
      'white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 1700);
}
ipcRenderer.on('sticky-toast', (_e, msg) => showToast(String(msg || '')));

ipcRenderer.on('sticky-set-highlight', (_e, mode) => {
  highlightMode = mode;
  const codeEl = document.getElementById('codeBlock')?.querySelector('code');
  if (codeEl) {
    // Code/file note: highlight the read-only <pre><code> directly.
    const raw = codeEl.dataset.raw || codeEl.textContent;
    codeEl.dataset.raw = raw;
    applyHighlight(raw, codeEl);
    // Re-wrap the line spans so the line-number gutter (and the # toggle)
    // survive a highlight change — applyHighlight rebuilds innerHTML.
    if (mode !== 'agent') wrapCodeLines(codeEl);
  } else {
    // Regular text note: live highlight via the backdrop behind the textarea.
    setSyntax(mode !== 'off');
    // Persist so the note reopens with syntax in the same state.
    const note = findNote(noteId) || { id: noteId, name: displayName };
    note.syntax = (mode !== 'off');
    note.saved_at = new Date().toISOString();
    saveNote(note);
  }
});

// ── Live syntax highlight for editable text notes (hljs backdrop) ─────────────
// A <textarea> can't style ranges, so when syntax is ON we make the textarea
// text transparent and render highlight.js HTML into the backdrop behind it
// (the same layer Find + Ctrl-underline use). The caret stays visible.
let syntaxOn = false;
let syntaxTimer = null;
function renderSyntax() {
  const ta = document.getElementById('noteText');
  const bd = document.getElementById('findHighlights');
  if (!ta || !bd || !window.hljs) return;
  bd.innerHTML = window.hljs.highlightAuto(ta.value).value + '\n';
  bd.scrollTop = ta.scrollTop;
  bd.scrollLeft = ta.scrollLeft;
}
function setSyntax(on) {
  syntaxOn = on;
  const ta = document.getElementById('noteText');
  const bd = document.getElementById('findHighlights');
  if (!ta || !bd) return;
  if (on) {
    bd.classList.add('syntax');
    if (window.hljs) {
      ta.style.color = 'transparent';
      ta.style.caretColor = getComputedStyle(document.body).color || '#000';
      renderSyntax();
    } else {
      // highlight.js (CDN) hasn't finished loading — keep the text VISIBLE so
      // the note is never blank, and retry once the script arrives.
      setTimeout(() => { if (syntaxOn) setSyntax(true); }, 200);
    }
  } else {
    bd.classList.remove('syntax');
    ta.style.color = '';
    ta.style.caretColor = '';
    bd.innerHTML = '';
  }
}
function scheduleSyntax() {
  if (!syntaxOn) return;
  clearTimeout(syntaxTimer);
  syntaxTimer = setTimeout(renderSyntax, 150);
}
// Restore the backdrop's default content after Find / Ctrl-underline cleared it.
function restoreBackdrop() {
  const bd = document.getElementById('findHighlights');
  if (!bd) return;
  if (syntaxOn) renderSyntax();
  else bd.innerHTML = '';
}

function readNotes() {
  try {
    const arr = JSON.parse(fs.readFileSync(notesJson, 'utf8'));
    if (Array.isArray(arr)) {
      return arr.filter(n => n && typeof n === 'object' && typeof n.id === 'string');
    }
    return [];
  } catch (e) {
    return [];
  }
}
function writeNotes(notes) {
  try {
    fs.mkdirSync(stickysDir, { recursive: true });
    fs.writeFileSync(notesJson, JSON.stringify(notes, null, 2), 'utf8');
  } catch (e) { console.error(e); }
}
function findNote(id) {
  return readNotes().find(n => n.id === id);
}
function saveNote(note) {
  const notes = readNotes();
  const idx = notes.findIndex(n => n.id === note.id);
  if (idx >= 0) notes[idx] = note;
  else notes.push(note);
  writeNotes(notes);
}

const titleText = document.getElementById('titleText');
const content = document.getElementById('content');
const closeBtn = document.getElementById('closeBtn');
const linesBtn = document.getElementById('linesBtn');

const titlebar = document.querySelector('.titlebar');
if (titlebar) {
  titlebar.addEventListener('dblclick', (e) => {
    e.preventDefault();
    e.stopPropagation();
  });
}

const saved = noteId ? findNote(noteId) : null;
let bgColor = (saved && saved.color) || params.get('color') || '#fff9c4';
let displayName = (saved && saved.name) || nameParam || noteId;

applyBgColor(bgColor);
titleText.textContent = displayName;

// Re-arm live syntax highlight if this text note had it on when it was closed.
if (saved && saved.syntax) {
  highlightMode = 'static';
  setSyntax(true);
}

function setColor(color) {
  bgColor = color;
  applyBgColor(color);
  const note = findNote(noteId) || { id: noteId, name: displayName };
  note.color = color;
  note.saved_at = new Date().toISOString();
  saveNote(note);
  ipcRenderer.send('sticky-color', noteId, color);
}

// Native context menu — can extend beyond window bounds
document.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const textarea = document.getElementById('noteText');
  const hasSelection = textarea && textarea.selectionStart !== textarea.selectionEnd;
  // Right-click ON a URL → offer link actions. Right-click first places the
  // caret at the click point, so linkTokenAt(selectionStart) resolves the link.
  const tok = textarea ? linkTokenAt(textarea.value, textarea.selectionStart) : null;
  const link = tok && tok.kind === 'url' ? tok.value : null;
  ipcRenderer.send('sticky-context-menu', noteId, hasSelection, bgColor, !!boundFilePath, link);
});

// File linking — main read the file and is handing us its content.
ipcRenderer.on('sticky-bind-file', (_e, info) => {
  try {
    const ta = document.getElementById('noteText');
    if (ta && info && typeof info.content === 'string') {
      ta.value = info.content;
      scheduleSyntax();
    }
    if (info && info.name && typeof titleText !== 'undefined' && titleText) {
      displayName = info.name;
      titleText.textContent = displayName;
    }
    setFileBound(info && info.path);
  } catch (err) {
    console.error('sticky: link apply failed:', err);
  }
});
ipcRenderer.on('sticky-unbind-file', () => { clearFileBound(); });
// The linked file changed on disk (another editor / an agent via apply_text_edits).
// Refresh the textarea — but skip if it already matches (our own save echoing back),
// which prevents a write↔watch loop.
ipcRenderer.on('sticky-file-changed', (_e, info) => {
  try {
    if (!info || typeof info.content !== 'string') return;
    const ta = document.getElementById('noteText');
    if (ta) {
      if (ta.value === info.content) return;
      const pos = ta.selectionStart;
      ta.value = info.content;
      try { ta.setSelectionRange(Math.min(pos, ta.value.length), Math.min(pos, ta.value.length)); } catch (e) {}
      scheduleSyntax();
    } else {
      const codeEl = document.getElementById('codeBlock')?.querySelector('code');
      if (codeEl) {
        if (codeEl.dataset.raw === info.content) return;
        codeEl.dataset.raw = info.content;
        applyHighlight(info.content, codeEl);
        if (highlightMode !== 'agent') wrapCodeLines(codeEl);
      }
    }
  } catch (err) {
    console.error('sticky: file-changed apply failed:', err);
  }
});
// Click the file badge to open the bound file in the OS editor.
{
  const fb = document.getElementById('fileBtn');
  if (fb) fb.addEventListener('click', (e) => {
    e.stopPropagation();
    if (boundFilePath) ipcRenderer.send('sticky-open-file', boundFilePath);
  });
}

// Handle actions dispatched from the native menu
ipcRenderer.on('sticky-set-color', (_e, color) => {
  setColor(color);
});

// this, an open window keeps showing stale content and the update appears to
// do nothing.
ipcRenderer.on('note-updated', (_e, payload) => {
  const text = payload && typeof payload.text === 'string' ? payload.text : '';
  const ta = document.getElementById('noteText');
  if (ta) {

// isSearchMode is already declared near the top alongside the font-size

if (isSearchMode) {
  content.innerHTML = `
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="search stickys" />
      <span class="search-refresh-btn" id="searchRefresh" title="Refresh sticky list">⟳</span>
    </div>
    <label class="search-opt"><input type="checkbox" id="optClear" checked> Clear previous search results</label>
    <label class="search-opt"><input type="checkbox" id="optReplace"> Replace existing stickys (vs. add to existing)</label>
    <div id="defaultView" class="default-view"></div>
    <div id="resultsList" class="results-list"></div>
  `;

  const searchInput = document.getElementById('searchInput');
  const resultsList = document.getElementById('resultsList');
  const defaultView = document.getElementById('defaultView');
  const optClear = document.getElementById('optClear');
  const optReplace = document.getElementById('optReplace');
  // Track which notes THIS search window opened, so "Clear previous search
  // results" can close just those before opening a fresh set.
  let lastOpenedIds = [];

  let allNotes = readNotes().filter(n => n.id !== 'sticky-search-window' && n.text && n.text.trim().length > 0);

  // Recency = when the note was last open/touched (close time, else save time,
  // else CREATION — agent/API-created notes have neither of the first two and
  // used to sort to the bottom with recency 0).
  const recencyKey = (n) =>
    Date.parse(n.last_closed_at || '') || Date.parse(n.saved_at || '') || Date.parse(n.created_at || '') || 0;

  // Short "Jul 12 14:32" stamp (no seconds) for list rows.
  const shortStamp = (n) => {
    const t = recencyKey(n);
    if (!t) return '';
    const d = new Date(t);
    const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
    const pad = (x) => String(x).padStart(2, '0');
    return `${mon} ${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };

  // Build a clickable result row for a note.
  function makeResultItem(note) {
    const item = document.createElement('div');
    item.className = 'result-item';
    item.style.backgroundColor = note.color && note.color.startsWith('#') ? note.color + '22' : 'rgba(0,0,0,0.03)';

    const header = document.createElement('div');
    header.className = 'result-item-header';
    const title = document.createElement('span');
    title.className = 'result-item-title';
    title.textContent = note.name || 'Untitled Note';
    header.appendChild(title);
    const stamp = document.createElement('span');
    stamp.textContent = shortStamp(note);
    stamp.style.cssText = 'margin-left:auto;font-size:10px;opacity:0.55;white-space:nowrap;padding-right:6px;';
    header.appendChild(stamp);
    const colorDot = document.createElement('span');
    colorDot.className = 'result-item-color';
    colorDot.style.backgroundColor = note.color && note.color.startsWith('#') ? note.color : '#fff9c4';
    header.appendChild(colorDot);
    item.appendChild(header);

    const body = document.createElement('div');
    body.className = 'result-item-body';
    body.textContent = note.text ? note.text.replace(/\s+/g, ' ').substring(0, 100) : 'Empty note';
    item.appendChild(body);

    // Single click only OPENS this sticky — never closes others. The user is
    // in charge of closing. (Bulk add/replace is the "Open all" button.)
    item.addEventListener('click', () => ipcRenderer.send('sticky-open-note', note.id));
    return item;
  }

  // Ids of the current result set — Enter opens them all.
  let currentMatchIds = [];

  // Summary is generated in the MAIN process (it knows which notes are
  // currently open = "active" vs merely saved). The search window stays open.
  function generateSummary() {
    ipcRenderer.send('generate-summary-sticky');
  }

  // Open every matching note. Honors the two checkboxes:
  //  - Replace existing stickys → close ALL currently-open stickys first.
  //  - Clear previous search results → close just the notes THIS window opened
  //    on its previous search before opening the new set.
  // The search window stays open so you can refine and search again.
  function openMatching(ids) {
    if (!ids.length) return;
    if (optReplace.checked) {
      ipcRenderer.send('open-matching-stickys', ids, true);
    } else {
      if (optClear.checked) {
        for (const id of lastOpenedIds) {
          if (!ids.includes(id)) ipcRenderer.send('sticky-close', id);
        }
      }
      ipcRenderer.send('open-matching-stickys', ids, false);
    }
    lastOpenedIds = ids.slice();
  }

  // Empty-query view: an actions dropdown (Summary) + a short list of recently
  // opened stickys. Deliberately does NOT list every sticky.
  function renderDefault() {
    defaultView.style.display = '';
    resultsList.style.display = 'none';
    defaultView.innerHTML = '';

    const dd = document.createElement('select');
    dd.className = 'action-dropdown';
    dd.innerHTML = '<option value="">⋯ Actions…</option><option value="summary">📋 Generate summary sticky</option>';
    dd.addEventListener('change', () => {
      if (dd.value === 'summary') generateSummary();
      dd.value = '';
    });
    defaultView.appendChild(dd);

    const heading = document.createElement('div');
    heading.className = 'recent-heading';
    heading.textContent = 'Recently opened';
    defaultView.appendChild(heading);

    const recent = [...allNotes].sort((a, b) => recencyKey(b) - recencyKey(a)).slice(0, 10);
    if (recent.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'no-results';
      empty.textContent = 'No stickys yet';
      defaultView.appendChild(empty);
    } else {
      const rl = document.createElement('div');
      rl.className = 'results-list';
      for (const note of recent) rl.appendChild(makeResultItem(note));
      defaultView.appendChild(rl);
    }
  }

  function renderResults(query) {
    if (!query.trim()) {
      currentMatchIds = [];
      renderDefault();
      return;
    }
    defaultView.style.display = 'none';
    resultsList.style.display = '';
    resultsList.innerHTML = '';
    const q = query.toLowerCase();
    const filtered = allNotes
      .filter(n =>
        (n.name && n.name.toLowerCase().includes(q)) || (n.text && n.text.toLowerCase().includes(q))
      )
      .sort((a, b) => recencyKey(b) - recencyKey(a)); // newest first
    currentMatchIds = filtered.map(n => n.id);
    if (filtered.length === 0) {
      resultsList.innerHTML = `<div class="no-results">No stickys found</div>`;
      return;
    }

    // Actions bar: open every match at once (Enter does the same). Add-vs-
    // replace is governed by the checkboxes above.
    const ids = filtered.map(n => n.id);
    const actions = document.createElement('div');
    actions.className = 'results-actions';
    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = `${filtered.length} match${filtered.length === 1 ? '' : 'es'}`;
    actions.appendChild(count);

    const openAllBtn = document.createElement('span');
    openAllBtn.className = 'results-action-btn';
    openAllBtn.textContent = 'Open all ↵';
    openAllBtn.title = 'Open every match (honors the checkboxes above)';
    openAllBtn.addEventListener('click', () => openMatching(ids));
    actions.appendChild(openAllBtn);

    resultsList.appendChild(actions);

    for (const note of filtered) resultsList.appendChild(makeResultItem(note));
  }

  // Refresh: re-read notes.json from disk and re-render the current view, so
  // notes created/edited/closed after this window opened show up without
  // reopening search.
  const refreshBtn = document.getElementById('searchRefresh');
  if (refreshBtn) {
    refreshBtn.addEventListener('click', () => {
      allNotes = readNotes().filter(n => n.id !== 'sticky-search-window' && n.text && n.text.trim().length > 0);
      renderResults(searchInput.value);
    });
  }

  // Live refresh: main pushes 'stickys-changed' on every note create/edit/
  // delete (writeAllNotes), so the list updates in real time — the ⟳ button
  // stays as a manual fallback.
  ipcRenderer.on('stickys-changed', () => {
    allNotes = readNotes().filter(n => n.id !== 'sticky-search-window' && n.text && n.text.trim().length > 0);
    renderResults(searchInput.value);
  });

  searchInput.addEventListener('input', () => renderResults(searchInput.value));
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      e.preventDefault();
      ipcRenderer.send('sticky-close', 'sticky-search-window');
    } else if (e.key === 'Enter') {
      e.preventDefault();
      openMatching(currentMatchIds); // open all current matches; window stays open
    }
  });

  searchInput.focus();
  renderDefault();
} else if (filePath) {
  let fileContent = '';
  let fileName = path.basename(filePath);
  let fileExt = path.extname(filePath).slice(1).toLowerCase();
  try { fileContent = fs.readFileSync(filePath, 'utf8'); }
  catch (e) { fileContent = 'Error reading file: ' + e.message; }

  titleText.textContent = fileName;
  linesBtn.style.display = '';

  const langMap = {
    js: 'javascript', ts: 'typescript', tsx: 'typescript', jsx: 'javascript',
    py: 'python', rb: 'ruby', rs: 'rust', go: 'go',
    sh: 'bash', ps1: 'powershell', md: 'markdown',
    json: 'json', yaml: 'yaml', yml: 'yaml', toml: 'ini',
    html: 'html', css: 'css', scss: 'scss', sql: 'sql'
  };
  const lang = langMap[fileExt] || fileExt;

  const pre = document.createElement('pre');
  pre.id = 'codeBlock';
  pre.className = 'with-lines';

  code.className = lang ? 'language-' + lang : '';
  code.dataset.raw = fileContent; // preserve raw for re-highlighting

  applyHighlight(fileContent, code);

  // Wrap each line in a .line span for the line-number gutter (static mode wraps

  if (highlightMode !== 'agent') wrapCodeLines(code);

} else {

  textarea.className = 'note-text';
  textarea.id = 'noteText';
  textarea.placeholder = '';

  // File-bound note: the file on disk is the source of truth. Read it fresh on

  if (saved && saved.source && saved.source.kind === 'file' && saved.source.path) {
    const translated = translateContainerPath(saved.source.path);
    try { textarea.value = fs.readFileSync(translated, 'utf8'); }

  findWrap.appendChild(textarea);

  content.appendChild(findWrap);

  // Keep the highlight backdrop scrolled in lock-step with the textarea.
  textarea.addEventListener('scroll', () => {
    highlightBackdrop.scrollTop = textarea.scrollTop;
    highlightBackdrop.scrollLeft = textarea.scrollLeft;
  });

  // Inline links: Ctrl/Cmd+click a URL or note-ref to open it. Plain click
  // places the cursor (normal editing) — the sticky is an editable text area,
  // so a plain click must not steal the action.
  textarea.addEventListener('click', (e) => {
    // Ctrl/Cmd+click still *follows* the link (opens it in the browser).
    if (e.ctrlKey || e.metaKey) {
      if (followLinkInTextarea(textarea)) e.preventDefault();
      return;
    }
    // Plain click on a URL → copy it + toast. (Right-click gives the full menu;
    // to edit inside a URL, click just outside it.)
    const tok = linkTokenAt(textarea.value, textarea.selectionStart);
    if (tok && tok.kind === 'url') {
      clipboard.writeText(tok.value);
      showToast('Link copied · right-click for options');
      e.preventDefault();
    }
  });
  // While Ctrl/Cmd is held: pointer cursor + underline every link in the note
  // (rendered into the highlight backdrop, which sits behind the textarea).
  const escBackdrop = (s) => s.replace(/[&<>]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
  let ctrlLinksShown = false;
  function showCtrlLinks() {
    // Don't fight the find feature or syntax mode for the backdrop. (In syntax
    // mode the textarea text is transparent, so underlines would float over
    // nothing — skip; the colored text is affordance enough.)
    const fb = document.getElementById('findBar');
    if (fb && fb.style.display !== 'none') return;
    if (syntaxOn) return;
    const text = textarea.value;
    const ranges = allLinkRanges(text);
    if (!ranges.length) { highlightBackdrop.innerHTML = ''; return; }
    let html = '';
    let pos = 0;
    for (const [s, e] of ranges) {
      if (s < pos) continue; // skip overlaps
      html += escBackdrop(text.slice(pos, s));
      html += '<span class="ctrl-link">' + escBackdrop(text.slice(s, e)) + '</span>';
      pos = e;
    }
    html += escBackdrop(text.slice(pos)) + '\n';
    highlightBackdrop.innerHTML = html;
    highlightBackdrop.scrollTop = textarea.scrollTop;
    highlightBackdrop.scrollLeft = textarea.scrollLeft;
  }
  function hideCtrlLinks() {
    const fb = document.getElementById('findBar');
    if (fb && fb.style.display !== 'none') return; // find owns the backdrop
    restoreBackdrop(); // back to syntax highlight (or empty) instead of blank
  }
  textarea.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && !ctrlLinksShown) {
      ctrlLinksShown = true;
      textarea.style.cursor = 'pointer';
      showCtrlLinks();
    }
  });
  const clearCtrl = () => {
    if (!ctrlLinksShown) return;
    ctrlLinksShown = false;
    textarea.style.cursor = '';
    hideCtrlLinks();
  };
  textarea.addEventListener('keyup', (e) => { if (!e.ctrlKey && !e.metaKey) clearCtrl(); });
  textarea.addEventListener('blur', clearCtrl);

  const forceFocus = (setCursorAtEnd = false) => {
    const findBar = document.getElementById('findBar');
    if (findBar && findBar.style.display !== 'none') {
      const findInput = document.getElementById('findInput');
      if (findInput && document.activeElement !== findInput) {
        findInput.focus();
      }
      return;
    }
    const titleInput = document.getElementById('titleInput');
    if (titleInput && titleInput.style.display !== 'none') {
      if (document.activeElement !== titleInput) {
        titleInput.focus();
      }
      return;
    }
    const schedOverlay = document.getElementById('schedOverlay');
    if (schedOverlay && schedOverlay.style.display !== 'none') {
      return;
    }

    if (document.activeElement !== textarea) {
      textarea.focus();
      if (setCursorAtEnd) {
        textarea.setSelectionRange(textarea.value.length, textarea.value.length);
      }
    }
  };
  forceFocus(true);
  setTimeout(() => forceFocus(true), 50);
  setTimeout(() => forceFocus(true), 200);
  setTimeout(() => forceFocus(true), 500);

  content.addEventListener('click', (e) => {
    if (e.target !== textarea) forceFocus(false);
  });
  document.body.addEventListener('click', (e) => {
    if (e.target === document.body) forceFocus(false);
  });
  window.addEventListener('focus', () => forceFocus(false));

  let saveTimer;
  textarea.addEventListener('input', () => {
    scheduleSyntax(); // re-render the syntax backdrop (no-op unless syntax is on)
    scheduleBoundFileSave(); // if file-bound, debounced write-through to disk
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      if (!noteId) return;
      const existing = findNote(noteId) || { id: noteId, name: displayName, color: bgColor };
      existing.text = textarea.value;
      existing.color = bgColor;
      existing.name = displayName;
      existing.saved_at = new Date().toISOString();
      saveNote(existing);
    }, 500);
  });

  // Restore the live note text refresh path through the syntax renderer.
  ipcRenderer.on('note-updated', () => { if (syntaxOn) scheduleSyntax(); });
}

// ─── Find in note (Ctrl+F) ──────────────────────────────────────────────
// Activates only when there's a real textarea (skipped for file-mode code
// notes and the search-stickys window). Case-insensitive, wraps around.
{
  const findBar = document.getElementById('findBar');
  const findInput = document.getElementById('findInput');
  const findCount = document.getElementById('findCount');
  let findMatches = [];
  let findIndex = -1;

  function getNoteTextarea() {
    return document.getElementById('noteText');
  }

  function escapeFindHtml(s) {
    return s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  }

  // Render every match as a <mark> in the backdrop behind the textarea. The
  // active match gets .current (orange); the rest are yellow. Text in the
  // backdrop is transparent — only the highlight rectangles show, under the
  // textarea's real (opaque) text.
  function renderFindHighlights() {
    const ta = getNoteTextarea();
    const bd = document.getElementById('findHighlights');
    if (!ta || !bd) return;
    if (!findMatches.length || !findInput.value) {
      bd.innerHTML = '';
      return;
    }
    const text = ta.value;
    const qlen = findInput.value.length;
    let html = '';
    let pos = 0;
    findMatches.forEach((start, idx) => {
      html += escapeFindHtml(text.slice(pos, start));
      const cls = idx === findIndex ? ' class="current"' : '';
      html += `<mark${cls}>` + escapeFindHtml(text.slice(start, start + qlen)) + '</mark>';
      pos = start + qlen;
    });
    html += escapeFindHtml(text.slice(pos)) + '\n';
    bd.innerHTML = html;
    bd.scrollTop = ta.scrollTop;
    bd.scrollLeft = ta.scrollLeft;
  }

  // Chrome-style scrollbar ticks. Only drawn when the note actually overflows
  // (has a scroll); otherwise the rail stays empty.
  function renderFindTicks() {
    const ta = getNoteTextarea();
    const bd = document.getElementById('findHighlights');
    const rail = document.getElementById('findTickrail');
    if (!ta || !bd || !rail) return;
    rail.innerHTML = '';
    if (!findMatches.length) return;
    if (ta.scrollHeight <= ta.clientHeight + 1) return; // no scroll → no ticks
    const railH = ta.clientHeight;
    const fullH = bd.scrollHeight || ta.scrollHeight;
    const marks = bd.querySelectorAll('mark');
    marks.forEach((m, idx) => {
      const tick = document.createElement('div');
      tick.className = 'find-tick' + (idx === findIndex ? ' current' : '');
      tick.style.top = `${(m.offsetTop / fullH) * railH}px`;
      rail.appendChild(tick);
    });
  }

  function updateFindCount() {
    findCount.textContent = findMatches.length ? `${findIndex + 1}/${findMatches.length}` : '0/0';
  }

  // Scroll the textarea so the active match is roughly centered, then refresh
  // the highlights (to move .current) and the ticks.
  function scrollToCurrentMatch() {
    const ta = getNoteTextarea();
    if (!ta || findIndex < 0) return;
    const start = findMatches[findIndex];
    const linesBefore = ta.value.substring(0, start).split('\n').length;
    const lineHeight = parseFloat(getComputedStyle(ta).lineHeight) || 22;
    ta.scrollTop = Math.max(0, linesBefore * lineHeight - ta.clientHeight / 2);
  }

  function refreshFind() {
    updateFindCount();
    renderFindHighlights();
    renderFindTicks();
  }

  function findCompute() {
    const ta = getNoteTextarea();
    findMatches = [];
    findIndex = -1;
    const q = findInput.value;
    if (ta && q) {
      const hay = ta.value.toLowerCase();
      const needle = q.toLowerCase();
      let i = hay.indexOf(needle);
      while (i !== -1) {
        findMatches.push(i);
        i = hay.indexOf(needle, i + 1);
      }
      if (findMatches.length) findIndex = 0;
    }
    if (findIndex >= 0) scrollToCurrentMatch();
    refreshFind();
  }
  function findNext() {
    if (!findMatches.length) return;
    findIndex = (findIndex + 1) % findMatches.length;
    scrollToCurrentMatch();
    refreshFind();
  }
  function findPrev() {
    if (!findMatches.length) return;
    findIndex = (findIndex - 1 + findMatches.length) % findMatches.length;
    scrollToCurrentMatch();
    refreshFind();
  }
  function openFind() {
    const ta = getNoteTextarea();
    if (!ta) return;
    // In syntax mode the textarea text is transparent; make it visible while
    // finding so the match highlights read against actual text.
    if (typeof syntaxOn !== 'undefined' && syntaxOn) ta.style.color = '';
    findBar.style.display = '';
    findInput.value = '';
    findMatches = [];
    findIndex = -1;
    refreshFind();
    findInput.focus();
  }
  function closeFind() {
    findBar.style.display = 'none';
    findMatches = [];
    findIndex = -1;
    const rail = document.getElementById('findTickrail');
    if (rail) rail.innerHTML = '';
    const ta = getNoteTextarea();
    // Restore syntax mode (transparent text + highlighted backdrop) if it was on.
    if (typeof syntaxOn !== 'undefined' && syntaxOn && ta) ta.style.color = 'transparent';
    if (typeof restoreBackdrop === 'function') restoreBackdrop();
    else { const bd = document.getElementById('findHighlights'); if (bd) bd.innerHTML = ''; }
    if (ta) ta.focus();
  }

  findInput.addEventListener('input', findCompute);
  findInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (e.shiftKey) findPrev();
      else findNext();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      closeFind();
    }
  });
  document.getElementById('findPrev').addEventListener('click', findPrev);
  document.getElementById('findNext').addEventListener('click', findNext);
  document.getElementById('findClose').addEventListener('click', closeFind);

  // Top-right search button in the titlebar — toggles the find bar. Hidden in
  // search-mode and file/code notes (no editable textarea to search).
  const searchBtn = document.getElementById('searchBtn');
  if (searchBtn) {
    if (isSearchMode || filePath) {
      searchBtn.style.display = 'none';
    } else {
      searchBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (findBar.style.display === 'none') openFind();
        else closeFind();
      });
    }
  }

  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f' && !e.shiftKey) {
      // Skip in the search-stickys window — that has its own Cmd+F-ish input.
      if (isSearchMode) return;
      e.preventDefault();
      openFind();
    }
  });
}
</script>
</body>
</html>
