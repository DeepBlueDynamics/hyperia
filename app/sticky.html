<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sticky</title>
<link id="hlTheme" rel="stylesheet" href="atom-one-light.min.css">
<style>
  /* hljs bg always transparent — note background is set by JS */
  .hljs { background: transparent !important; }
  .ai-highlight-banner {
    font-size: 10px;
    opacity: 0.6;
    padding: 2px 8px;
    flex-shrink: 0;
    font-style: italic;
  }
  .ai-highlight-banner.loading { opacity: 0.8; }
  .ai-spinner { display: inline-block; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<!-- highlight.js for code-note syntax highlighting. Pinned version +
     Subresource Integrity hash + crossorigin so the browser refuses to
     execute the script if the bytes don't match — that bounds the
     CodeQL js/functionality-from-untrusted-source risk to "the file was
     compromised at our build time" rather than "any future server
     compromise". TODO: vendor locally to fully close this. -->
<script
  src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"
  integrity="sha384-OQ8WUq1L6F+1nrkgmkQQwbnNwxTHC1WtRdhBoP+sZ8RaMl3xMmkrcUVN+pYL6tDP"
  crossorigin="anonymous"
  referrerpolicy="no-referrer"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    /* color set dynamically by textColorForBg() */
    font-family: 'Cascadia Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
    font-size: 13px;
    display: flex;
    flex-direction: column;
  }
  .titlebar {
    height: 22px;
    display: flex;
    align-items: center;
    padding: 0 4px 0 8px;
    -webkit-app-region: drag;
    flex-shrink: 0;
    font-size: 10px;
    user-select: none;
    background: rgba(0,0,0,0.08);
  }
  .titlebar-text {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: inherit;
    font-size: 10px;
    font-weight: bold;
    opacity: 0.7;
  }
  .titlebar-btn {
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    cursor: pointer;
    -webkit-app-region: no-drag;
    font-size: 13px;
    opacity: 0.7;
    transition: opacity 0.15s, background 0.15s;
    z-index: 100;
    line-height: 1;
  }
  .titlebar-btn:hover { opacity: 1; }
  .close-btn { font-weight: bold; }
  .close-btn:hover { background: rgba(180, 0, 0, 0.25); }
  .lines-btn:hover { background: rgba(128, 128, 128, 0.2); }

  /* Link bar */
  .link-bar {
    display: none;
    flex-direction: column;
    flex-shrink: 0;
    background: rgba(0,0,0,0.06);
    border-bottom: 1px solid rgba(0,0,0,0.08);
    font-size: 10px;
    padding: 2px 4px;
    gap: 1px;
  }
  .link-bar.visible { display: flex; }
  .link-row {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
    height: 16px;
  }
  .link-icon { opacity: 0.5; flex-shrink: 0; font-size: 9px; }
  .link-label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    opacity: 0.75;
    cursor: pointer;
    font-family: inherit;
  }
  .link-label:hover { opacity: 1; text-decoration: underline; }
  .link-action {
    flex-shrink: 0;
    cursor: pointer;
    opacity: 0.45;
    font-size: 10px;
    padding: 0 2px;
    border-radius: 2px;
    transition: opacity 0.1s;
    -webkit-app-region: no-drag;
  }
  .link-action:hover { opacity: 1; background: rgba(128,128,128,0.2); }
  .link-action.disabled { opacity: 0.2; cursor: default; }
  .link-action.disabled:hover { background: none; }

  .content {
    flex: 1;
    overflow: hidden;
    padding: 4px 6px 6px 8px;
    display: flex;
    flex-direction: column;
  }

  /* Single scrollbar via textarea only */
  .note-text {
    width: 100%;
    flex: 1;
    border: none;
    background: transparent;
    color: inherit;
    font-family: inherit;
    font-size: 13px;
    resize: none;
    outline: none;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
    tab-size: 2;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 4px;
  }

  /* Slim color-coded scrollbars */
  .note-text::-webkit-scrollbar,
  pre::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  .note-text::-webkit-scrollbar-track,
  pre::-webkit-scrollbar-track {
    background: transparent;
  }
  .note-text::-webkit-scrollbar-thumb,
  pre::-webkit-scrollbar-thumb {
    background: rgba(128, 128, 128, 0.35);
    border-radius: 3px;
  }
  .note-text::-webkit-scrollbar-thumb:hover,
  pre::-webkit-scrollbar-thumb:hover {
    background: rgba(128, 128, 128, 0.55);
  }

  pre {
    margin: 0;
    flex: 1;
    font-family: inherit;
    font-size: 12px;
    line-height: 1.6;
    tab-size: 4;
    background: transparent !important;
    color: inherit;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-y: auto;
    overflow-x: hidden;
  }
  code { background: transparent !important; }

  .with-lines { counter-reset: line; }
  .with-lines .line {
    display: block;
    counter-increment: line;
  }
  .with-lines .line::before {
    content: counter(line);
    display: inline-block;
    width: 3ch;
    margin-right: 0.75em;
    text-align: right;
    opacity: 0.3;
    font-size: 10px;
    user-select: none;
  }

</style>
</head>
<body>
  <div class="titlebar">
    <span class="titlebar-text" id="titleText"></span>
    <span class="titlebar-btn lines-btn" id="linesBtn" style="display:none" title="Toggle line numbers">#</span>
    <span class="titlebar-btn close-btn" id="closeBtn" title="Close">&times;</span>
  </div>
  <div class="link-bar" id="linkBar"></div>
  <div class="ai-highlight-banner" id="aiBanner" style="display:none"></div>
  <div class="content" id="content"></div>

<script>
const { ipcRenderer, clipboard } = require('electron');
const fs = require('fs');
const path = require('path');
const os = require('os');

const params = new URLSearchParams(window.location.search);
const noteId = params.get('id') || '';
const filePath = params.get('file') || '';
const nameParam = params.get('name') || '';

const stickysDir = path.join(os.homedir(), '.hyperia', 'stickys');
const notesJson = path.join(stickysDir, 'notes.json');

const CODE_THEMES = {
  'code:light': { bg: '#f8f8f2', text: '#383a42', css: 'atom-one-light.min.css' },
  'code:dark':  { bg: '#1e1e2e', text: '#cdd6f4', css: 'atom-one-dark.min.css'  }
};

// Compute readable text color from background using relative luminance (WCAG).
function textColorForBg(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255;
  const g = parseInt(hex.slice(3, 5), 16) / 255;
  const b = parseInt(hex.slice(5, 7), 16) / 255;
  const toLinear = c => c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  const L = 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
  return L > 0.25 ? '#1a1a1a' : '#f0f0f0';
}

function applyBgColor(colorOrCode) {
  const theme = CODE_THEMES[colorOrCode];
  if (theme) {
    document.body.style.background = theme.bg;
    document.body.style.color = theme.text;
    document.getElementById('hlTheme').href = theme.css;
  } else {
    document.body.style.background = colorOrCode;
    document.body.style.color = textColorForBg(colorOrCode);
    document.getElementById('hlTheme').href = 'atom-one-light.min.css';
  }
}

// ── AI highlight ─────────────────────────────────────────────────────────────
const agentCache = new Map(); // content hash → rules
let highlightMode = 'static'; // 'static' | 'agent' | 'off'

function simpleHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
  return h.toString(36);
}

function applyRules(content, rules) {
  // Build annotated HTML from rules applied in order
  // Mark positions to annotate
  const marks = []; // {start, end, className, color}
  for (const rule of rules) {
    try {
      const re = new RegExp(rule.pattern, rule.flags || 'g');
      let m;
      while ((m = re.exec(content)) !== null) {
        marks.push({start: m.index, end: m.index + m[0].length, className: rule.className || '', color: rule.color || ''});
        if (m[0].length === 0) re.lastIndex++;
      }
    } catch { /* invalid regex from agent — skip */ }
  }
  // Sort by start, resolve overlaps (later rules win — skip overlapping marks)
  marks.sort((a, b) => a.start - b.start);
  let out = '';
  let pos = 0;
  for (const mark of marks) {
    if (mark.start < pos) continue; // overlapping, skip
    out += escHtml(content.slice(pos, mark.start));
    const style = mark.color ? ` style="color:${mark.color}"` : '';
    out += `<span class="${mark.className}"${style}>${escHtml(content.slice(mark.start, mark.end))}</span>`;
    pos = mark.end;
  }
  out += escHtml(content.slice(pos));
  return out;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

const aiBanner = document.getElementById('aiBanner');

async function runAgentHighlight(content, codeEl) {
  const key = simpleHash(content);
  aiBanner.style.display = '';
  aiBanner.className = 'ai-highlight-banner loading';
  aiBanner.innerHTML = '<span class="ai-spinner">↻</span> AI highlighting…';

  let rules;
  if (agentCache.has(key)) {
    rules = agentCache.get(key);
  } else {
    try {
      const port = 9800;
      const resp = await fetch(`http://localhost:${port}/api/notes/highlight`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({content: content.slice(0, 4000)})
      });
      const data = await resp.json();
      rules = data.rules || [];
      agentCache.set(key, rules);
    } catch (e) {
      aiBanner.className = 'ai-highlight-banner';
      aiBanner.textContent = 'AI highlight unavailable — using auto';
      rules = null;
    }
  }

  if (rules) {
    codeEl.innerHTML = applyRules(content, rules);
    aiBanner.className = 'ai-highlight-banner';
    aiBanner.textContent = `AI highlighted · ${rules.length} rule${rules.length !== 1 ? 's' : ''}`;
  } else {
    // fallback to static
    if (window.hljs) { codeEl.textContent = content; window.hljs.highlightElement(codeEl); }
    aiBanner.style.display = 'none';
  }
}

function applyHighlight(content, codeEl) {
  if (highlightMode === 'off') {
    codeEl.textContent = content;
    aiBanner.style.display = 'none';
  } else if (highlightMode === 'agent') {
    runAgentHighlight(content, codeEl);
  } else {
    // static — highlight.js
    codeEl.textContent = content;
    if (window.hljs) window.hljs.highlightElement(codeEl);
    aiBanner.style.display = 'none';
  }
}

// ── Link bar ─────────────────────────────────────────────────────────────────
const linkBar = document.getElementById('linkBar');
const URL_RE = /https?:\/\/[^\s"'<>)\]]+/g;
// [From: note-name-or-id] and app://sticky/note-id
const NOTE_FROM_RE = /\[From:\s*([^\]]+)\]/g;
const NOTE_URL_RE  = /app:\/\/sticky\/([^\s"'<>)\]]+)/g;

function addLinkRow(icon, label, title, onLabelClick, actions) {
  const row = document.createElement('div');
  row.className = 'link-row';

  const ic = document.createElement('span');
  ic.className = 'link-icon';
  ic.textContent = icon;
  row.appendChild(ic);

  const lbl = document.createElement('span');
  lbl.className = 'link-label';
  lbl.textContent = label;
  lbl.title = title || label;
  lbl.addEventListener('click', onLabelClick);
  row.appendChild(lbl);

  for (const {text, title: aTitle, onClick, disabled} of actions) {
    const btn = document.createElement('span');
    btn.className = 'link-action' + (disabled ? ' disabled' : '');
    btn.textContent = text;
    btn.title = aTitle;
    if (!disabled) btn.addEventListener('click', onClick);
    row.appendChild(btn);
  }

  linkBar.appendChild(row);
  linkBar.classList.add('visible');
}

function addSourceLink(filePath) {
  const parts = filePath.replace(/\\/g, '/').split('/');
  const label = parts.length > 1
    ? parts.slice(-2).join('/')
    : parts[parts.length - 1];

  addLinkRow('📄', label, filePath,
    () => ipcRenderer.send('sticky-open-file', filePath),
    []
  );
}

function addWebLinks(text) {
  const matches = [...new Set((text.match(URL_RE) || []))].slice(0, 3);
  for (const url of matches) {
    const short = url.replace(/^https?:\/\//, '').replace(/\/$/, '');
    addLinkRow('🔗', short, url,
      () => ipcRenderer.send('sticky-open-external', url),
      [
        { text: '↗', title: 'Open in browser',   onClick: () => ipcRenderer.send('sticky-open-external', url) },
        { text: '⬜', title: 'Open in web pane', onClick: () => ipcRenderer.send('sticky-open-web-pane', url) }
      ]
    );
  }
}

function addNoteLinks(text) {
  const seen = new Set();
  // [From: note-name] pattern
  NOTE_FROM_RE.lastIndex = 0;
  let m;
  while ((m = NOTE_FROM_RE.exec(text)) !== null) {
    const ref = m[1].trim();
    if (seen.has(ref)) continue;
    seen.add(ref);
    addLinkRow('📝', ref, `Open note: ${ref}`,
      () => ipcRenderer.send('sticky-open-note', ref),
      []
    );
  }
  // app://sticky/id pattern
  NOTE_URL_RE.lastIndex = 0;
  while ((m = NOTE_URL_RE.exec(text)) !== null) {
    const id = m[1].trim();
    if (seen.has(id)) continue;
    seen.add(id);
    addLinkRow('📝', id, `Open note: ${id}`,
      () => ipcRenderer.send('sticky-open-note', id),
      []
    );
  }
}

ipcRenderer.on('sticky-set-highlight', (_e, mode) => {
  highlightMode = mode;
  const codeEl = document.getElementById('codeBlock')?.querySelector('code');
  if (codeEl) {
    const raw = codeEl.dataset.raw || codeEl.textContent;
    codeEl.dataset.raw = raw;
    applyHighlight(raw, codeEl);
  }
});

function readNotes() {
  try { return JSON.parse(fs.readFileSync(notesJson, 'utf8')); }
  catch { return []; }
}
function writeNotes(notes) {
  try {
    fs.mkdirSync(stickysDir, { recursive: true });
    fs.writeFileSync(notesJson, JSON.stringify(notes, null, 2), 'utf8');
  } catch (e) { console.error(e); }
}
function findNote(id) {
  return readNotes().find(n => n.id === id);
}
function saveNote(note) {
  const notes = readNotes();
  const idx = notes.findIndex(n => n.id === note.id);
  if (idx >= 0) notes[idx] = note;
  else notes.push(note);
  writeNotes(notes);
}

const titleText = document.getElementById('titleText');
const content = document.getElementById('content');
const closeBtn = document.getElementById('closeBtn');
const linesBtn = document.getElementById('linesBtn');

const saved = noteId ? findNote(noteId) : null;
let bgColor = (saved && saved.color) || params.get('color') || '#fff9c4';
let displayName = (saved && saved.name) || nameParam || noteId;

applyBgColor(bgColor);
titleText.textContent = displayName;

function setColor(color) {
  bgColor = color;
  applyBgColor(color);
  const note = findNote(noteId) || { id: noteId, name: displayName };
  note.color = color;
  note.saved_at = new Date().toISOString();
  saveNote(note);
  ipcRenderer.send('sticky-color', noteId, color);
}

// Native context menu — can extend beyond window bounds
document.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const textarea = document.getElementById('noteText');
  const hasSelection = textarea && textarea.selectionStart !== textarea.selectionEnd;
  ipcRenderer.send('sticky-context-menu', noteId, hasSelection, bgColor);
});

// Handle actions dispatched from the native menu
ipcRenderer.on('sticky-set-color', (_e, color) => {
  setColor(color);
});
ipcRenderer.on('sticky-copy-all', () => {
  const el = document.getElementById('noteText');
  if (el) clipboard.writeText(el.value);
});
ipcRenderer.on('sticky-rename', () => {
  const newName = prompt('Rename note:', displayName);
  if (newName && newName.trim()) {
    displayName = newName.trim();
    titleText.textContent = displayName;
    const note = findNote(noteId) || { id: noteId, color: bgColor };
    note.name = displayName;
    note.saved_at = new Date().toISOString();
    saveNote(note);
  }
});
ipcRenderer.on('sticky-delete', () => {
  if (confirm('Delete this note?')) {
    const notes = readNotes().filter(n => n.id !== noteId);
    writeNotes(notes);
    ipcRenderer.send('sticky-close', noteId);
  }
});

closeBtn.addEventListener('click', (e) => {
  e.preventDefault();
  e.stopPropagation();
  ipcRenderer.send('sticky-close', noteId);
});

if (filePath) {
  let fileContent = '';
  let fileName = path.basename(filePath);
  let fileExt = path.extname(filePath).slice(1).toLowerCase();
  try { fileContent = fs.readFileSync(filePath, 'utf8'); }
  catch (e) { fileContent = 'Error reading file: ' + e.message; }

  titleText.textContent = fileName;
  linesBtn.style.display = '';
  addSourceLink(filePath);

  const langMap = {
    js: 'javascript', ts: 'typescript', tsx: 'typescript', jsx: 'javascript',
    py: 'python', rb: 'ruby', rs: 'rust', go: 'go',
    sh: 'bash', ps1: 'powershell', md: 'markdown',
    json: 'json', yaml: 'yaml', yml: 'yaml', toml: 'ini',
    html: 'html', css: 'css', scss: 'scss', sql: 'sql'
  };
  const lang = langMap[fileExt] || fileExt;

  const pre = document.createElement('pre');
  pre.id = 'codeBlock';
  pre.className = 'with-lines';
  const code = document.createElement('code');
  code.className = lang ? 'language-' + lang : '';
  code.dataset.raw = fileContent; // preserve raw for re-highlighting
  pre.appendChild(code);
  content.appendChild(pre);

  applyHighlight(fileContent, code);

  // Re-wrap lines after highlight (static mode wraps after hljs; agent mode skips)
  function wrapLines() {
    const lines = code.innerHTML.split('\n');
    code.innerHTML = lines.map(l => '<span class="line">' + l + '</span>').join('');
  }
  if (highlightMode !== 'agent') wrapLines();

  linesBtn.addEventListener('click', () => {
    pre.classList.toggle('with-lines');
  });
} else {
  const textarea = document.createElement('textarea');
  textarea.className = 'note-text';
  textarea.id = 'noteText';
  textarea.placeholder = '';
  textarea.value = (saved && saved.text) || '';
  textarea.spellcheck = false;
  content.appendChild(textarea);

  // Show web links and note references found in initial content
  addWebLinks(textarea.value);
  addNoteLinks(textarea.value);

  // Rescan links after a pause while typing (debounced)
  let linkScanTimer;
  textarea.addEventListener('input', () => {
    clearTimeout(linkScanTimer);
    linkScanTimer = setTimeout(() => {
      linkBar.innerHTML = '';
      linkBar.classList.remove('visible');
      addWebLinks(textarea.value);
      addNoteLinks(textarea.value);
    }, 800);
  });

  const forceFocus = () => {
    textarea.focus();
    textarea.setSelectionRange(textarea.value.length, textarea.value.length);
  };
  forceFocus();
  setTimeout(forceFocus, 50);
  setTimeout(forceFocus, 200);
  setTimeout(forceFocus, 500);

  content.addEventListener('click', () => forceFocus());
  document.body.addEventListener('click', (e) => {
    if (e.target === document.body) forceFocus();
  });
  window.addEventListener('focus', forceFocus);

  let saveTimer;
  textarea.addEventListener('input', () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      if (!noteId) return;
      const existing = findNote(noteId) || { id: noteId, name: displayName, color: bgColor };
      existing.text = textarea.value;
      existing.color = bgColor;
      existing.name = displayName;
      existing.saved_at = new Date().toISOString();
      saveNote(existing);
    }, 500);
  });
}
</script>
</body>
</html>
