<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'none'; font-src 'none'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>Sticky</title>
<link id="hlTheme" rel="stylesheet" href="atom-one-light.min.css">
<link rel="stylesheet" href="sticky-renderer/chrome.css">
<link rel="stylesheet" href="sticky-renderer/editor.css">
<link rel="stylesheet" href="sticky-renderer/schedule.css">
<link rel="stylesheet" href="sticky-renderer/search.css">
<!-- highlight.js for code-note syntax highlighting. Vendored locally (v11.9.0,
     app/highlight.min.js copied to target by webpack) so highlighting works
     offline and never depends on a CDN that a slow/blocked network can drop. -->
<script src="highlight.min.js"></script>
</head>
<body>
  <div class="titlebar">
    <span class="titlebar-text" id="titleText"></span>
    <input type="text" class="titlebar-input" id="titleInput" style="display:none" spellcheck="false" />
    <span class="titlebar-spacer"></span>
    <span class="titlebar-btn lines-btn" id="linesBtn" style="display:none" title="Toggle line numbers">#</span>
    <span class="titlebar-btn schedule-btn" id="scheduleBtn" title="Run this sticky (now, at a time, or on a schedule)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <polyline points="12 7 12 12 15 14" />
      </svg>
    </span>
    <span class="titlebar-btn search-btn" id="searchBtn" title="Find in note (Ctrl+F)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <line x1="21" y1="21" x2="16.5" y2="16.5" />
      </svg>
    </span>
    <span class="titlebar-btn file-btn" id="fileBtn" style="display:none" title="Linked to a file — click to open it">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
        <polyline points="14 2 14 8 20 8" />
      </svg>
    </span>
    <span class="titlebar-btn close-btn" id="closeBtn" title="Close (saved to closed notes)">
      <!-- Inline SVG × matching the terminal pane close button: bigger + crisper
           than the &times; glyph, same crossed-lines shape and currentColor.
           NOTE: closing a sticky does NOT delete it — it's archived to closed
           notes (sticky-close marks last_closed_at, keeps the record). -->
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </span>
  </div>
  <div class="find-bar" id="findBar" style="display:none">
    <input type="text" id="findInput" placeholder="Find in note…" spellcheck="false" />
    <span class="find-count" id="findCount">0/0</span>
    <button id="findPrev" title="Previous match (Shift+Enter)">↑</button>
    <button id="findNext" title="Next match (Enter)">↓</button>
    <button id="findClose" title="Close (Esc)">×</button>
  </div>
  <div class="ai-highlight-banner" id="aiBanner" style="display:none"></div>
  <div class="content" id="content"></div>

  <!-- Run panel: picker-style overlay opened by the ⏰ button; schedule-ui.js wires it. -->
  <div class="sched-overlay" id="schedOverlay" style="display:none">
    <div class="sched-panel">
      <div class="sched-head"><span>⏰ Run this sticky</span><span class="sched-close" id="schedCancel" title="Cancel">×</span></div>
      <div class="sched-row"><label>When</label>
        <div class="seg" id="segWhen"><span data-v="now">Now</span><span data-v="at">At</span><span data-v="every">Every</span></div>
      </div>
      <div class="sched-row" id="rowAt"><label></label><input type="datetime-local" id="runAt" /></div>
      <div class="sched-sub" id="rowEvery">
        <div class="sched-row"><label></label>
          <select id="everyKind"><option value="interval">Interval</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="cron">Advanced (cron)</option></select>
        </div>
        <div class="sched-row" id="rowInterval"><label>every</label><input type="number" id="intervalN" min="1" value="15" />
          <select id="intervalUnit"><option value="m">minutes</option><option value="h">hours</option></select></div>
        <div class="sched-row" id="rowDaily"><label>at</label><input type="time" id="dailyTime" /></div>
        <div class="sched-row sched-days" id="rowWeekly"><label>on</label><span id="weeklyDays"></span></div>
        <div class="sched-row" id="rowWeeklyTime"><label>at</label><input type="time" id="weeklyTime" /></div>
        <div class="sched-row" id="rowCron"><label>cron</label><input type="text" id="cronExpr" placeholder="0 9 * * 1-5" spellcheck="false" /></div>
      </div>
      <div class="sched-row"><label>Run</label>
        <div class="seg" id="segTarget"><span data-v="notify">Notify</span><span data-v="agent">Agent</span><span data-v="pane">Pane</span></div>
      </div>
      <div class="sched-sub" id="rowAgent">
        <div class="sched-note" id="n8Notice" style="display:none"></div>
        <div class="sched-row"><label>Agent</label><select id="agentProvider"></select></div>
        <div class="sched-row"><label>Image</label><input type="text" id="agentImage" value="default" disabled />
          <span class="sched-hint">Picking an image: coming soon</span></div>
        <div class="sched-row"><label>Dir</label><input type="text" id="agentDir" placeholder="folder to mount" spellcheck="false" />
          <span class="sched-pick" id="agentPickDir" title="Pick directory">📁</span></div>
        <div class="sched-row"><label></label><label class="sched-check"><input type="checkbox" id="agentDanger" /> danger mode</label></div>
      </div>
      <div class="sched-sub" id="rowPane">
        <div class="sched-row"><label>Pane</label><select id="paneSelect"></select></div>
        <div class="sched-hint">Needs your approval when you schedule.</div>
      </div>
      <div class="sched-row"><label>History</label><label class="sched-check"><input type="checkbox" id="historyKeep" /> keep</label>
        <input type="number" id="historyLimit" min="1" value="50" /><span class="sched-hint">runs</span></div>
      <div class="sched-error" id="runError" style="display:none"></div>
      <div class="sched-status" id="runStatus" style="display:none"></div>
      <div class="sched-actions">
        <span class="sched-btn ghost" id="schedUnschedule" style="display:none">Unschedule</span>
        <span class="sched-spacer"></span>
        <span class="sched-btn plain" id="schedCancelBtn">Cancel</span>
        <span class="sched-btn" id="schedRunNow">Run now</span>
        <span class="sched-btn" id="schedConfirm">Schedule</span>
      </div>
    </div>
  </div>

  <!-- Run history: same overlay look, filled by run-view.js. -->
  <div class="sched-overlay" id="histOverlay" style="display:none">
    <div class="sched-panel hist-panel">
      <div class="sched-head"><span id="histTitle">History</span><span class="sched-close" id="histClose" title="Close">×</span></div>
      <div class="hist-list" id="histList"></div>
    </div>
  </div>

  <!-- Styled confirm (replaces the native window.confirm box). -->
  <div class="sched-overlay" id="confirmOverlay" style="display:none">
    <div class="sched-panel">
      <div class="sched-head">
        <span id="confirmTitle">Delete this note?</span>
        <span class="sched-close" id="confirmClose" title="Cancel">×</span>
      </div>
      <div class="confirm-msg" id="confirmMsg">This can't be undone.</div>
      <div class="sched-actions">
        <span class="sched-btn neutral" id="confirmCancel">Cancel</span>
        <span class="sched-btn danger" id="confirmOk">Delete</span>
      </div>
    </div>
  </div>

<script src="sticky-renderer/boot.js"></script>
</body>
</html>
